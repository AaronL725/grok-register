name: Comprehensive Outlook implementation audit

on:
  push:
    branches: [feature/outlook-mailbox-pool]
    paths:
      - .github/workflows/outlook-cancellation-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/outlook-mailbox-pool
          fetch-depth: 0

      - name: Apply audit hardening
        run: |
          python tools/finalize_outlook_audit.py
          python tools/finalize_outlook_size_guard.py

      - name: Verify repository hygiene
        run: |
          if grep -RniE 'msdsj|grok-account-manager-main|github\.com/msdsj' README.md *.py web tests config.example.json .gitignore; then
            echo 'Forbidden external provenance reference found.' >&2
            exit 1
          fi
          if grep -n '验证码: {code}' registration_flow.py; then
            echo 'Verification code is still logged by the shared registration flow.' >&2
            exit 1
          fi

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.9
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Remove one-shot audit files
        run: |
          rm -f tools/finalize_outlook_audit.py
          rm -f tools/finalize_outlook_size_guard.py
          rm -f .github/workflows/outlook-final-audit.yml
          rm -f .github/workflows/outlook-cancellation-finalize.yml

      - name: Commit validated audit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Outlook mailbox pool audit hardening"
          git push origin HEAD:feature/outlook-mailbox-pool

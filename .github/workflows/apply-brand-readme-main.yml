name: Finalize requested brand and README update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/brand-readme-placement-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync latest main and preserve requested result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains latest main"
            exit 0
          fi
          set +e
          git merge origin/main --no-edit
          merge_status=$?
          set -e
          if [ $merge_status -ne 0 ]; then
            git rm -f .github/workflows/apply-brand-readme-main.yml || true
            git add -A
            git commit --no-edit
          fi
          git rm -f .github/workflows/apply-brand-readme-main.yml || true
          git rm -f .github/workflows/apply-brand-readme-placement.yml || true
          git rm -f .github/.brand-readme-trigger || true
          python -m unittest tests.test_web_ui_static -v
          git diff --check HEAD~1 HEAD || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary brand README workflow"
          fi
          git push origin HEAD:${{ github.head_ref }}

name: Proxy pool validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: github.event.pull_request.head.ref == 'feat/proxy-pool-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Finish proxy pool implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return False
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one target, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          # registration_browser: managed leases must never silently fall back to direct mid-account.
          p = Path('registration_browser.py')
          text = p.read_text(encoding='utf-8')
          if 'from proxy_pool import ProxyTransportError' not in text:
              text = text.replace('from curl_cffi import requests\n', 'from curl_cffi import requests\nfrom proxy_pool import ProxyTransportError\n', 1)
          helper = '''\n\ndef _managed_proxy_mode():\n    try:\n        return str(config.get("proxy_mode", "auto") or "auto").strip().lower() in ("single", "pool")\n    except Exception:\n        return False\n'''
          if 'def _managed_proxy_mode():' not in text:
              text = text.replace('SIGNUP_URL = "https://accounts.x.ai/sign-up?redirect=grok-com"\n', 'SIGNUP_URL = "https://accounts.x.ai/sign-up?redirect=grok-com"\n' + helper, 1)
          old = '    raise Exception(f"浏览器启动失败，已重试4次: {last_exc}")\n'
          new = '''    if _managed_proxy_mode() and is_proxy_connection_error(last_exc):\n        raise ProxyTransportError("Chromium 通过当前代理启动失败: %s" % last_exc) from last_exc\n    raise Exception(f"浏览器启动失败，已重试4次: {last_exc}")\n'''
          if new not in text:
              if text.count(old) != 1: raise SystemExit('registration_browser start target mismatch')
              text = text.replace(old, new, 1)
          old = '''    try:\n        _open_with_current_browser()\n    except Exception as e:\n        if browser_started_with_proxy and get_configured_proxy():\n            if log_callback:\n                log_callback(f"[!] 浏览器代理访问注册页失败，自动回退直连: {e}")\n            restart_browser(log_callback=log_callback, use_proxy=False)\n            _open_with_current_browser()\n        else:\n            raise\n\n    if browser_started_with_proxy and page_has_proxy_error(page):\n        if log_callback:\n            log_callback("[!] 浏览器页面显示代理错误，自动回退直连")\n        restart_browser(log_callback=log_callback, use_proxy=False)\n        _open_with_current_browser()\n'''
          new = '''    try:\n        _open_with_current_browser()\n    except Exception as e:\n        if browser_started_with_proxy and get_configured_proxy():\n            if _managed_proxy_mode():\n                raise ProxyTransportError("当前代理访问注册页失败: %s" % e) from e\n            if log_callback:\n                log_callback(f"[!] 浏览器代理访问注册页失败，自动回退直连: {e}")\n            restart_browser(log_callback=log_callback, use_proxy=False)\n            _open_with_current_browser()\n        else:\n            raise\n\n    if browser_started_with_proxy and page_has_proxy_error(page):\n        if _managed_proxy_mode():\n            raise ProxyTransportError("Chromium 页面显示代理连接错误")\n        if log_callback:\n            log_callback("[!] 浏览器页面显示代理错误，自动回退直连")\n        restart_browser(log_callback=log_callback, use_proxy=False)\n        _open_with_current_browser()\n'''
          if new not in text:
              if text.count(old) != 1: raise SystemExit('registration_browser open target mismatch')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # proxy_pool: honor configured probe provider and schedule periodic probes asynchronously.
          p = Path('proxy_pool.py')
          text = p.read_text(encoding='utf-8')
          if 'self.probe_provider =' not in text:
              text = text.replace('        self.probe_timeout = max(3, int(self.config.get("proxy_pool_probe_timeout_sec") or 15))\n', '        self.probe_timeout = max(3, int(self.config.get("proxy_pool_probe_timeout_sec") or 15))\n        self.probe_provider = str(self.config.get("proxy_pool_probe_provider") or "cloudflare").strip().lower()\n        self._periodic_probe_running = False\n', 1)
          if 'self._schedule_periodic_probe_if_due()' not in text:
              text = text.replace('        self.refresh_if_due()\n        deadline = time.time()', '        self.refresh_if_due()\n        self._schedule_periodic_probe_if_due()\n        deadline = time.time()', 1)
          marker = '    def probe_node(self, node_id):\n'
          method = '''    def _schedule_periodic_probe_if_due(self):\n        if self.probe_interval <= 0:\n            return\n        now = time.time()\n        with self._lock:\n            if self._periodic_probe_running or now - self._last_probe_all < self.probe_interval:\n                return\n            self._periodic_probe_running = True\n\n        def runner():\n            try:\n                self.probe_all(force=True)\n            except Exception as exc:\n                self.log("[Debug] 代理池定期探测失败: %s" % exc)\n            finally:\n                with self._lock:\n                    self._periodic_probe_running = False\n\n        threading.Thread(target=runner, name="proxy-probe-periodic", daemon=True).start()\n\n'''
          if 'def _schedule_periodic_probe_if_due' not in text:
              if marker not in text: raise SystemExit('proxy_pool probe marker missing')
              text = text.replace(marker, method + marker, 1)
          old = '''            response = requests.get(\n                "https://www.cloudflare.com/cdn-cgi/trace",\n                proxies={"http": proxy_url, "https": proxy_url},\n                timeout=self.probe_timeout,\n                allow_redirects=False,\n            )\n            if not 200 <= int(response.status_code) < 300:\n                raise ProxyPoolError("HTTP %s" % response.status_code)\n            for line in str(response.text or "").splitlines():\n                if line.startswith("ip="):\n                    exit_ip = line[3:].strip()\n                    break\n            status = "healthy"\n'''
          new = '''            if self.probe_provider == "ipinfo":\n                response = requests.get(\n                    "https://ipinfo.io/json",\n                    proxies={"http": proxy_url, "https": proxy_url},\n                    timeout=self.probe_timeout,\n                    allow_redirects=False,\n                )\n                if not 200 <= int(response.status_code) < 300:\n                    raise ProxyPoolError("HTTP %s" % response.status_code)\n                try:\n                    exit_ip = str((response.json() or {}).get("ip") or "").strip()\n                except Exception:\n                    exit_ip = ""\n            else:\n                response = requests.get(\n                    "https://www.cloudflare.com/cdn-cgi/trace",\n                    proxies={"http": proxy_url, "https": proxy_url},\n                    timeout=self.probe_timeout,\n                    allow_redirects=False,\n                )\n                if not 200 <= int(response.status_code) < 300:\n                    raise ProxyPoolError("HTTP %s" % response.status_code)\n                for line in str(response.text or "").splitlines():\n                    if line.startswith("ip="):\n                        exit_ip = line[3:].strip()\n                        break\n            status = "healthy"\n'''
          if new not in text:
              if text.count(old) != 1: raise SystemExit('proxy provider target mismatch')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # GUI: expose compact proxy-pool controls without duplicating the WebUI status table.
          p = Path('grok_register_ttk.py')
          text = p.read_text(encoding='utf-8')
          block = '''\n        add_label(15, 0, "代理模式:")\n        self.proxy_mode_var = tk.StringVar(value=str(config.get("proxy_mode", "auto")))\n        self.proxy_mode_combo = tk_option_menu(config_frame, self.proxy_mode_var, ["auto", "direct", "single", "pool"], width=12)\n        add_field(self.proxy_mode_combo, 15, 1, sticky=tk.W)\n        add_label(15, 2, "代理池回退:")\n        self.proxy_fallback_var = tk.StringVar(value=str(config.get("proxy_fallback", "none")))\n        self.proxy_fallback_combo = tk_option_menu(config_frame, self.proxy_fallback_var, ["none", "direct", "single"], width=12)\n        add_field(self.proxy_fallback_combo, 15, 3, sticky=tk.W)\n\n        add_label(16, 0, "代理池文件:")\n        self.proxy_pool_file_var = tk.StringVar(value=str(config.get("proxy_pool_file", "")))\n        self.proxy_pool_file_entry = tk_entry(config_frame, textvariable=self.proxy_pool_file_var, width=34)\n        add_field(self.proxy_pool_file_entry, 16, 1)\n        add_label(16, 2, "节点类型:")\n        self.proxy_endpoint_mode_var = tk.StringVar(value=str(config.get("proxy_pool_endpoint_mode", "auto")))\n        self.proxy_endpoint_mode_combo = tk_option_menu(config_frame, self.proxy_endpoint_mode_var, ["auto", "fixed", "rotating"], width=12)\n        add_field(self.proxy_endpoint_mode_combo, 16, 3, sticky=tk.W)\n\n        add_label(17, 0, "代理订阅 URL:")\n        self.proxy_subscription_var = tk.StringVar(value=str(config.get("proxy_pool_subscription_url", "")))\n        self.proxy_subscription_entry = tk_entry(config_frame, textvariable=self.proxy_subscription_var, width=72)\n        add_field(self.proxy_subscription_entry, 17, 1, columnspan=3)\n\n        add_label(18, 0, "单节点并发:")\n        self.proxy_capacity_var = tk.StringVar(value=str(config.get("proxy_pool_max_concurrent_per_node", 1)))\n        self.proxy_capacity_spinbox = tk.Spinbox(config_frame, from_=1, to=64, width=8, textvariable=self.proxy_capacity_var, bg=UI_ENTRY_BG, fg=UI_FG, insertbackground=UI_FG, buttonbackground=UI_BUTTON_BG, relief=tk.SOLID)\n        add_field(self.proxy_capacity_spinbox, 18, 1, sticky=tk.W)\n        self.proxy_test_btn = tk_button(config_frame, text="测试代理池", command=self.test_proxy_pool)\n        add_field(self.proxy_test_btn, 18, 3, sticky=tk.W)\n'''
          marker = '        self._sync_multithread_controls()\n\n        btn_frame = tk.Frame(main_frame, bg=UI_BG)'
          if 'self.proxy_mode_var = tk.StringVar' not in text:
              if marker not in text: raise SystemExit('GUI insertion marker missing')
              text = text.replace(marker, '        self._sync_multithread_controls()\n' + block + '\n        btn_frame = tk.Frame(main_frame, bg=UI_BG)', 1)
          save_marker = '        config["proxy"] = self.proxy_var.get().strip()\n'
          save_block = '''        config["proxy"] = self.proxy_var.get().strip()\n        config["proxy_mode"] = self.proxy_mode_var.get().strip() or "auto"\n        config["proxy_fallback"] = self.proxy_fallback_var.get().strip() or "none"\n        config["proxy_pool_file"] = self.proxy_pool_file_var.get().strip()\n        config["proxy_pool_subscription_url"] = self.proxy_subscription_var.get().strip()\n        config["proxy_pool_endpoint_mode"] = self.proxy_endpoint_mode_var.get().strip() or "auto"\n'''
          if save_block not in text:
              if text.count(save_marker) != 1: raise SystemExit('GUI save marker mismatch')
              text = text.replace(save_marker, save_block, 1)
          num_marker = '            config["multi_thread_workers"] = int(self.multi_thread_workers_var.get())\n'
          num_block = '            config["multi_thread_workers"] = int(self.multi_thread_workers_var.get())\n            config["proxy_pool_max_concurrent_per_node"] = int(self.proxy_capacity_var.get())\n'
          if num_block not in text:
              if text.count(num_marker) != 1: raise SystemExit('GUI numeric marker mismatch')
              text = text.replace(num_marker, num_block, 1)
          method_marker = '    def start_registration(self):\n'
          method = '''    def test_proxy_pool(self):\n        if self.is_running:\n            self.log("[!] 注册任务运行期间不能手动测试代理池")\n            return\n        def worker():\n            try:\n                candidate = dict(config)\n                candidate.update({\n                    "proxy_mode": self.proxy_mode_var.get().strip() or "auto",\n                    "proxy": self.proxy_var.get().strip(),\n                    "proxy_fallback": self.proxy_fallback_var.get().strip() or "none",\n                    "proxy_pool_file": self.proxy_pool_file_var.get().strip(),\n                    "proxy_pool_subscription_url": self.proxy_subscription_var.get().strip(),\n                    "proxy_pool_endpoint_mode": self.proxy_endpoint_mode_var.get().strip() or "auto",\n                    "proxy_pool_max_concurrent_per_node": int(self.proxy_capacity_var.get()),\n                })\n                candidate = validate_config_structure(candidate)\n                from proxy_pool import get_manager, reset_manager\n                try:\n                    reset_manager()\n                except Exception:\n                    pass\n                manager = get_manager(config=candidate, log=self.log)\n                manager.reload_sources(force=True)\n                results = manager.probe_all(force=True) if manager.managed else []\n                healthy = sum(1 for item in results if item.get("status") == "healthy")\n                self.log("[*] 代理池测试完成: %s/%s 个节点健康" % (healthy, len(results)))\n            except Exception as exc:\n                self.log("[!] 代理池测试失败: %s" % exc)\n        threading.Thread(target=worker, name="proxy-pool-gui-test", daemon=True).start()\n\n'''
          if '    def test_proxy_pool(self):' not in text:
              if method_marker not in text: raise SystemExit('GUI method marker missing')
              text = text.replace(method_marker, method + method_marker, 1)
          p.write_text(text, encoding='utf-8')

          # README: document the new proxy-pool modes while keeping legacy proxy compatibility explicit.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          section = '''\n### 代理与代理池\n\n默认 `proxy_mode=auto`，旧配置无需修改：`proxy` 为空时直连，非空时继续使用原单代理逻辑。需要账号级稳定代理租约时，可切换到 `single` 或 `pool`。\n\n```json\n{\n  "proxy_mode": "pool",\n  "proxy": "",\n  "proxy_fallback": "none",\n  "proxy_pool_file": "./proxies.txt",\n  "proxy_pool_subscription_url": "",\n  "proxy_pool_endpoint_mode": "auto",\n  "proxy_pool_max_concurrent_per_node": 1\n}\n```\n\n- `single`：把 `proxy` 作为受健康度与冷却管理的固定节点。\n- `pool`：从本地文件和/或订阅加载多个节点，按账号注册 Session 获取稳定 Lease。\n- 同一次账号注册中的浏览器、邮箱请求、NSFW 与默认 CPA 网络都会保持同一个 Lease；邮箱重试不会换代理，完整 slot 重试才会重新获取。\n- 支持 HTTP/HTTPS/SOCKS4/SOCKS5，以及认证代理；包含 `{account}` 的地址会自动按旋转入口处理，每次完整 attempt 生成稳定 session 标识。\n- 固定节点发生明确 transport failure 时会降健康度并进入指数冷却，同时触发后台恢复探测；普通业务失败、验证码失败、认证/限流等不会直接处罚代理。\n- WebUI 提供独立“代理池”页，可查看脱敏节点、健康度、出口 IP、延迟、占用、失败数和冷却状态，并手动重新加载/测试。GUI 提供精简代理池配置与测试按钮。\n- `cpa_proxy` 若显式设置始终优先；远端管理类后处理继续使用其既有网络隔离规则，不继承注册 Lease。\n\n更多参数和运行机制见 `docs/proxy-pool.md`。\n\n'''
          marker = '### DuckMail\n'
          if '### 代理与代理池\n' not in text:
              if marker not in text: raise SystemExit('README marker missing')
              text = text.replace(marker, section + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Focused regression tests for managed browser fallback policy and probe-provider switch.
          Path('tests/test_proxy_pool_completion.py').write_text('''import unittest\nfrom unittest.mock import Mock, patch\n\nfrom app_config import DEFAULT_CONFIG\nfrom proxy_pool import ProxyPoolManager\n\n\nclass ProxyPoolCompletionTests(unittest.TestCase):\n    def config(self, **updates):\n        cfg = dict(DEFAULT_CONFIG)\n        cfg.update(updates)\n        return cfg\n\n    def test_ipinfo_probe_provider_is_honored(self):\n        manager = ProxyPoolManager(self.config(proxy_mode="single", proxy="http://127.0.0.1:8001", proxy_pool_probe_provider="ipinfo"))\n        response = Mock(status_code=200)\n        response.json.return_value = {"ip": "203.0.113.7"}\n        with patch("proxy_pool.requests.get", return_value=response) as get:\n            result = manager.probe_node(manager.snapshot()["nodes"][0]["id"])\n        self.assertEqual(result["status"], "healthy")\n        self.assertEqual(result["exit_ip"], "203.0.113.7")\n        self.assertEqual(get.call_args.args[0], "https://ipinfo.io/json")\n\n    def test_periodic_probe_scheduler_is_non_blocking_and_coalesced(self):\n        manager = ProxyPoolManager(self.config(proxy_mode="single", proxy="http://127.0.0.1:8001", proxy_pool_probe_interval_sec=1))\n        manager._last_probe_all = 0\n        with patch.object(manager, "probe_all", return_value=[]) as probe:\n            manager._schedule_periodic_probe_if_due()\n            manager._schedule_periodic_probe_if_due()\n            import time\n            deadline = time.time() + 1\n            while time.time() < deadline and probe.call_count == 0:\n                time.sleep(0.01)\n        self.assertEqual(probe.call_count, 1)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add registration_browser.py proxy_pool.py grok_register_ttk.py README.md tests/test_proxy_pool_completion.py
            git commit -m "feat: complete proxy pool runtime integration"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-web.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m unittest discover -s tests -v

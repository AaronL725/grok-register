name: proxy-pool-v3-validation
on:
  push:
    branches: [feat/proxy-pool-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - run: python -m compileall -q .
      - run: node --check web/proxy-pool.js
      - run: git diff --check origin/main...HEAD
      - run: python -m unittest discover -s tests -v
      - name: Validate advanced proxy configs with sing-box
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.13.18
          curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          SING_BOX="/tmp/sing-box-${VERSION}-linux-amd64/sing-box"
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from proxy_protocol_runtime import ProtocolRuntimeManager
          from proxy_protocols import parse_proxy_line

          vmess = {
              "v": "2", "ps": "VMess", "add": "vmess.example.com", "port": "443",
              "id": "11111111-1111-1111-1111-111111111111", "aid": "0",
              "scy": "auto", "net": "ws", "type": "none", "host": "vmess.example.com",
              "path": "/ws", "tls": "tls", "sni": "vmess.example.com"
          }
          vmess_uri = "vmess://" + base64.b64encode(json.dumps(vmess).encode()).decode()
          uris = {
              "vless": "vless://11111111-1111-1111-1111-111111111111@vless.example.com:443?security=tls&sni=vless.example.com",
              "vmess": vmess_uri,
              "trojan": "trojan://secret@trojan.example.com:443?sni=trojan.example.com",
              "hysteria2": "hysteria2://secret@hy2.example.com:443?sni=hy2.example.com",
              "tuic": "tuic://11111111-1111-1111-1111-111111111111:secret@tuic.example.com:443?sni=tuic.example.com",
              "shadowsocks": "ss://YWVzLTI1Ni1nY206c2VjcmV0@ss.example.com:8388#SS",
          }
          manager = ProtocolRuntimeManager({})
          root = Path("/tmp/proxy-configs")
          root.mkdir(exist_ok=True)
          for name, uri in uris.items():
              descriptor = parse_proxy_line(uri)
              config = manager._build_config(descriptor, 32000)
              (root / (name + ".json")).write_text(json.dumps(config), encoding="utf-8")
          PY
          for config in /tmp/proxy-configs/*.json; do
            echo "checking ${config}"
            "$SING_BOX" check -c "$config"
          done

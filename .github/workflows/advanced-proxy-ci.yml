name: advanced-proxy-ci

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate generated advanced-protocol configs with sing-box
        run: |
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v1.13.18/sing-box-1.13.18-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          SINGBOX="/tmp/sing-box-1.13.18-linux-amd64/sing-box"
          chmod +x "$SINGBOX"
          SINGBOX="$SINGBOX" python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          from proxy_protocol_runtime import ProtocolRuntimeManager
          from proxy_protocols import parse_proxy_line

          vmess = {
              "v": "2", "ps": "VMess", "add": "vmess.example.com", "port": "443",
              "id": "11111111-1111-1111-1111-111111111111", "aid": "0", "scy": "auto",
              "net": "ws", "type": "none", "host": "cdn.example.com", "path": "/ws",
              "tls": "tls", "sni": "vmess.example.com"
          }
          vmess_uri = "vmess://" + base64.b64encode(json.dumps(vmess).encode()).decode().rstrip("=")
          uris = [
              "vless://11111111-1111-1111-1111-111111111111@vless.example.com:443?security=tls&sni=vless.example.com&type=ws&path=%2Fws#VLESS",
              vmess_uri,
              "trojan://secret@trojan.example.com:443?sni=trojan.example.com&type=grpc&serviceName=test#Trojan",
              "hysteria2://secret@hy2.example.com:443?sni=hy2.example.com&obfs=salamander&obfs-password=test#HY2",
              "tuic://11111111-1111-1111-1111-111111111111:secret@tuic.example.com:443?sni=tuic.example.com&congestion_control=bbr&udp_relay_mode=native#TUIC",
          ]
          manager = ProtocolRuntimeManager({})
          binary = os.environ["SINGBOX"]
          for index, uri in enumerate(uris, start=1):
              descriptor = parse_proxy_line(uri)
              config = manager._build_config(descriptor, 33000 + index)
              fd, path = tempfile.mkstemp(suffix=".json")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as handle:
                      json.dump(config, handle)
                  completed = subprocess.run([binary, "check", "-c", path], capture_output=True, text=True)
                  if completed.returncode != 0:
                      raise SystemExit("%s config rejected: %s" % (descriptor.protocol, (completed.stderr or completed.stdout).strip()))
                  print("checked", descriptor.protocol)
              finally:
                  try:
                      os.unlink(path)
                  except OSError:
                      pass
          PY
      - name: WebUI JavaScript syntax
        run: node --check web/proxy-pool.js
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD

name: Run grok2api upgrade

on:
  push:
    branches: [fix/upgrade-grok2api-remote]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upgrade-grok2api-remote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_grok2api_remote_upgrade.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add account_outputs.py app_config.py config.example.json grok_register_ttk.py README.md tests/test_grok2api_go_remote.py
          git commit -m "feat: upgrade remote grok2api integration"
          git push origin HEAD:fix/upgrade-grok2api-remote

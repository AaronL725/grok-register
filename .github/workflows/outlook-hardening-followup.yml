name: Outlook hardening follow-up

on:
  push:
    branches: [feature/outlook-mailbox-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run second Outlook audit repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/outlook-mailbox-hardening
          fetch-depth: 0

      - name: Apply second audit repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{path}: start marker not found: {start}')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'{path}: end marker not found: {end}')
              p.write_text(text[:i] + replacement + text[j:], encoding='utf-8')

          replace_once(
              'outlook_mail.py',
              '''    graph: dict[str, GraphFolderCursor] = field(default_factory=dict)\n    imap_token: Optional[str] = None\n''',
              '''    graph: dict[str, GraphFolderCursor] = field(default_factory=dict)\n    graph_seen_ids: set[str] = field(default_factory=set)\n    imap_token: Optional[str] = None\n''',
          )
          replace_once(
              'outlook_mail.py',
              '''        self.imap.clear()\n        self.graph.clear()\n''',
              '''        self.imap.clear()\n        self.graph.clear()\n        self.graph_seen_ids.clear()\n''',
          )
          replace_between(
              'outlook_mail.py',
              'def _graph_inbox_count(',
              'def _graph_messages(',
              '',
          )
          replace_once(
              'outlook_mail.py',
              '''        newest_received=max(received) if received else "",\n''',
              '''        newest_received=max(received, key=_received_epoch) if received else "",\n''',
          )
          replace_once(
              'outlook_mail.py',
              '''    state.graph_token = token\n    state.graph = cursors\n    if errors:\n''',
              '''    state.graph_token = token\n    state.graph = cursors\n    state.graph_seen_ids = set().union(*(cursor.seen_ids for cursor in cursors.values()))\n    if errors:\n''',
          )
          replace_between(
              'outlook_mail.py',
              'def _graph_message_is_new(',
              'def wait_for_outlook_code(',
              '''def _graph_message_is_new(\n    message: dict,\n    cursor: GraphFolderCursor,\n    global_seen_ids: Optional[set[str]] = None,\n) -> bool:\n    message_id = str(message.get("id") or "").strip()\n    received = str(message.get("receivedDateTime") or "").strip()\n    if (\n        not message_id\n        or message_id in cursor.seen_ids\n        or (global_seen_ids is not None and message_id in global_seen_ids)\n    ):\n        return False\n    received_epoch = _received_epoch(received)\n    if cursor.baseline_epoch and (not received_epoch or received_epoch < cursor.baseline_epoch):\n        return False\n    newest_epoch = _received_epoch(cursor.newest_received)\n    if newest_epoch and (not received_epoch or received_epoch < newest_epoch):\n        return False\n    return True\n\n\ndef _advance_graph_cursor(\n    cursor: GraphFolderCursor,\n    messages: list[dict],\n    global_seen_ids: Optional[set[str]] = None,\n) -> None:\n    for message in messages:\n        message_id = str(message.get("id") or "").strip()\n        if message_id:\n            cursor.seen_ids.add(message_id)\n            if global_seen_ids is not None:\n                global_seen_ids.add(message_id)\n        received = str(message.get("receivedDateTime") or "").strip()\n        if _received_epoch(received) > _received_epoch(cursor.newest_received):\n            cursor.newest_received = received\n    if len(cursor.seen_ids) > OUTLOOK_GRAPH_SCAN_DEPTH * 4:\n        cursor.seen_ids = {\n            str(item.get("id") or "").strip()\n            for item in messages\n            if str(item.get("id") or "").strip()\n        }\n\n\ndef _scan_graph_once(\n    token: str,\n    state: OutlookMailboxState,\n    email: str = "",\n    log_callback: LogCallback = None,\n    cancel_callback=None,\n) -> Optional[str]:\n    for cursor in state.graph.values():\n        frontier = _graph_messages(token, cursor.folder_name, cancel_callback=cancel_callback)\n        new_messages = [\n            message\n            for message in frontier\n            if _graph_message_is_new(message, cursor, state.graph_seen_ids)\n        ]\n        if new_messages:\n            _log(log_callback, f"[*] Outlook Graph {cursor.folder_name} 发现 {len(new_messages)} 封新邮件")\n\n        # Do not advance the cursor until every newly discovered message in\n        # this frontier has been successfully fetched and inspected. A transient\n        # detail-fetch failure must remain retryable on the next poll.\n        for metadata in new_messages:\n            if any(key in metadata for key in ("subject", "bodyPreview", "body", "from")):\n                message = metadata\n            else:\n                message = _graph_message_detail(\n                    token, str(metadata.get("id") or ""), cancel_callback=cancel_callback\n                )\n            body = message.get("body") if isinstance(message.get("body"), dict) else {}\n            sender_data = message.get("from") if isinstance(message.get("from"), dict) else {}\n            address = sender_data.get("emailAddress") if isinstance(sender_data.get("emailAddress"), dict) else {}\n            code = extract_verification_code(\n                str(message.get("subject") or ""),\n                str(message.get("bodyPreview") or ""),\n                str(body.get("content") or ""),\n                str(address.get("address") or ""),\n            )\n            if code:\n                _advance_graph_cursor(cursor, frontier, state.graph_seen_ids)\n                _log(log_callback, f"[*] Outlook Graph 已获取验证码（文件夹: {cursor.folder_name}）")\n                return _normalize_code(code)\n\n        _advance_graph_cursor(cursor, frontier, state.graph_seen_ids)\n    return None\n\n\n''',
          )

          # Python clears exception targets after an except block. Capture the
          # rendered error as a default argument before scheduling the Tk callback.
          replace_once(
              'grok_register_ttk.py',
              '''                except Exception as exc:\n                    def show_error():\n                        status_var.set("测试失败: %s" % exc)\n                        messagebox.showerror("Outlook 邮箱池测试失败", str(exc), parent=window)\n                    window.after(0, show_error)\n''',
              '''                except Exception as exc:\n                    def show_error(error=str(exc)):\n                        status_var.set("测试失败: %s" % error)\n                        messagebox.showerror("Outlook 邮箱池测试失败", error, parent=window)\n                    window.after(0, show_error)\n''',
          )

          test_path = Path('tests/test_outlook_audit.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_graph_cursor_ignores_old_unseen_message_after_deletion_or_move(self):\n'
          if marker not in tests:
              raise SystemExit('tests/test_outlook_audit.py: graph insertion marker missing')
          addition = '''    def test_graph_detail_failure_does_not_advance_cursor(self):\n        cursor = outlook_mail.GraphFolderCursor(\n            "inbox", outlook_mail.OUTLOOK_GRAPH_INBOX_KEY,\n            newest_received="2026-09-14T10:00:00Z",\n            seen_ids={"baseline"},\n        )\n        state = outlook_mail.OutlookMailboxState(\n            graph={cursor.key: cursor}, graph_token="token"\n        )\n        metadata = {"id": "retry-me", "receivedDateTime": "2026-09-14T10:01:00Z"}\n        with patch.object(outlook_mail, "_graph_messages", return_value=[metadata]), \\\n             patch.object(outlook_mail, "_graph_message_detail", side_effect=RuntimeError("temporary 503")):\n            with self.assertRaisesRegex(RuntimeError, "temporary 503"):\n                outlook_mail._scan_graph_once("token", state)\n        self.assertNotIn("retry-me", cursor.seen_ids)\n        self.assertNotIn("retry-me", state.graph_seen_ids)\n        self.assertEqual(cursor.newest_received, "2026-09-14T10:00:00Z")\n\n    def test_graph_seen_ids_are_shared_across_inbox_and_junk(self):\n        inbox = outlook_mail.GraphFolderCursor(\n            "inbox", outlook_mail.OUTLOOK_GRAPH_INBOX_KEY,\n            newest_received="2026-09-14T10:00:00Z",\n            seen_ids={"baseline"},\n        )\n        junk = outlook_mail.GraphFolderCursor(\n            "junkemail", outlook_mail.OUTLOOK_GRAPH_JUNK_KEY,\n            newest_received="2026-09-14T10:00:00Z",\n            seen_ids=set(),\n        )\n        state = outlook_mail.OutlookMailboxState(\n            graph={inbox.key: inbox, junk.key: junk},\n            graph_token="token",\n            graph_seen_ids={"baseline"},\n        )\n        moved = graph_message(\n            "cross-folder", "2026-09-14T10:01:00Z",\n            "Verification code ABC-123", "ABC-123", "no-reply@x.ai",\n        )\n        with patch.object(outlook_mail, "_graph_messages", side_effect=[[moved], [moved]]):\n            self.assertEqual(outlook_mail._scan_graph_once("token", state), "ABC123")\n        self.assertIn("cross-folder", state.graph_seen_ids)\n        self.assertFalse(outlook_mail._graph_message_is_new(moved, junk, state.graph_seen_ids))\n\n'''
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

          git diff --check
          python -m compileall -q outlook_mail.py grok_register_ttk.py tests/test_outlook_audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outlook_mail.py grok_register_ttk.py tests/test_outlook_audit.py
          git commit -m "Fix Outlook Graph retry cursor edge cases"
          git push origin HEAD:feature/outlook-mailbox-hardening

name: Apply minimal WebUI brand order patch

on:
  push:
    branches:
      - fix/web-brand-repo-console

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-brand-repo-console
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply exact patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.repo-pill:hover{background:rgba(200,255,0,.14);border-color:rgba(200,255,0,.48);box-shadow:0 0 14px rgba(200,255,0,.10);transform:translateY(-1px)}.spacer{flex:1}'
          new_css = '.repo-pill:hover{background:rgba(200,255,0,.14);border-color:rgba(200,255,0,.48);box-shadow:0 0 14px rgba(200,255,0,.10);transform:translateY(-1px)}.console-pill{font-size:11px;font-weight:600;background:rgba(208,255,0,.15);color:var(--accent);padding:2px 10px;border-radius:20px;border:1px solid rgba(208,255,0,.30)}.spacer{flex:1}'
          assert old_css in text, 'expected repo-pill CSS anchor not found'
          text = text.replace(old_css, new_css, 1)

          old_html = '<span>@grok-register</span></a>\n  </div>'
          new_html = '<span>@grok-register</span></a>\n    <span class="console-pill" data-i18n="console">控制台</span>\n  </div>'
          assert old_html in text, 'expected repository badge anchor not found'
          text = text.replace(old_html, new_html, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_web_ui_static.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = "        self.assertNotIn('class=\"console-pill\"', self.html)"
          new_test = "        self.assertIn('class=\"console-pill\" data-i18n=\"console\">控制台</span>', self.html)\n        self.assertIn('.console-pill{font-size:11px;font-weight:600;background:rgba(208,255,0,.15)', self.html)"
          assert old_test in tests, 'expected old console-pill assertion not found'
          tests = tests.replace(old_test, new_test, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m unittest tests.test_web_ui_static -v
          git diff --check
      - name: Commit final files and remove workflow
        run: |
          rm .github/workflows/apply-web-brand-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/index.html tests/test_web_ui_static.py .github/workflows/apply-web-brand-order.yml
          git commit -m "fix(web): show repository link before console badge"
          git push origin HEAD:fix/web-brand-repo-console

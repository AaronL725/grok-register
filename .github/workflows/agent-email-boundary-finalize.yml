name: agent final email boundary
on:
  push:
    branches: [agent/fix-registration-reliability-plan]
permissions:
  contents: write
jobs:
  finalize-email-boundary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-registration-reliability-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact email boundary patch
        run: python .github/agent_email_boundary_finalize.py
      - name: Install dependencies
        run: python -m pip install -r requirements-web.txt pytest
      - name: Run full suite
        run: pytest -q
      - name: Commit validated email boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_browser.py tests/test_reliability_final_audit.py
          git commit -m "fix: gate email commit boundary on readiness"
          git push origin HEAD:agent/fix-registration-reliability-plan

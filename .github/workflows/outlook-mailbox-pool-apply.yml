name: Outlook mailbox pool integration

on:
  push:
    branches: [feature/outlook-mailbox-pool]
    paths:
      - tools/apply_outlook_mailbox_pool_patch.py
      - .github/workflows/outlook-mailbox-pool-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-mailbox-pool-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/outlook-mailbox-pool
          fetch-depth: 0

      - name: Apply exact integration patch
        run: python tools/apply_outlook_mailbox_pool_patch.py

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Install and test on Python 3.9
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Install and test on Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Remove one-shot integration files
        run: |
          rm -f tools/apply_outlook_mailbox_pool_patch.py
          rm -f .github/workflows/outlook-mailbox-pool-apply.yml

      - name: Commit validated integration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Outlook mailbox pool integration"
          git push origin HEAD:feature/outlook-mailbox-pool

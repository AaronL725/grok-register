name: Apply focused cookie banner fix

on:
  push:
    branches: [fix/cookie-banner-click-retry]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cookie-banner-click-retry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal fix and focused tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('cpa_xai/browser_confirm.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _dismiss_cookie_banner(page: Any, log: LogFn) -> bool:
              for label in (
                  "接受所有 Cookie",
                  "接受所有Cookie",
                  "全部允许",
                  "Allow all",
                  "Allow All Cookies",
                  "Allow all cookies",
                  "Accept All Cookies",
                  "Accept all cookies",
                  "接受",
                  "Accept",
              ):
                  if _click_exact(page, [label], log, real=True):
                      log("cookie banner dismissed: %s" % label)
                      return True
              return False
          '''
          new = '''def _click_cookie_button(page: Any, label: str, log: LogFn) -> bool:
              target = None
              for attempt in range(3):
                  target = _find_button_exact(page, label)
                  if target:
                      try:
                          target.click()
                          log("clicked cookie button: %s" % label)
                          return True
                      except Exception as exc:
                          if attempt < 2:
                              log("cookie button not ready %s (attempt %s/3): %s" % (label, attempt + 1, exc))
                  if attempt < 2:
                      _sleep(0.35)
              if target:
                  try:
                      target.click(by_js=True)
                      log("clicked cookie button by JS: %s" % label)
                      return True
                  except Exception as exc:
                      log("cookie button click failed %s: %s" % (label, exc))
              return False


          def _wait_cookie_banner_gone(page: Any, timeout_sec: float = 1.5) -> bool:
              deadline = time.time() + float(timeout_sec)
              while time.time() < deadline:
                  if not _cookie_banner_visible(_visible_text(page)):
                      return True
                  _sleep(0.15)
              return False


          def _dismiss_cookie_banner(page: Any, log: LogFn) -> bool:
              for label in (
                  "接受所有 Cookie",
                  "接受所有Cookie",
                  "全部允许",
                  "Allow all",
                  "Allow All Cookies",
                  "Allow all cookies",
                  "Accept All Cookies",
                  "Accept all cookies",
                  "接受",
                  "Accept",
              ):
                  if not _click_cookie_button(page, label, log):
                      continue
                  if _wait_cookie_banner_gone(page):
                      log("cookie banner dismissed: %s" % label)
                      return True
                  log("cookie button clicked but banner remains: %s" % label)
              return False
          '''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_cookie_banner_click.py')
          test.write_text('''import unittest
          from unittest.mock import patch

          from cpa_xai import browser_confirm


          class Button:
              def __init__(self, real_failures=0, js_fails=False):
                  self.real_failures = real_failures
                  self.js_fails = js_fails
                  self.real_calls = 0
                  self.js_calls = 0

              def click(self, by_js=False):
                  if by_js:
                      self.js_calls += 1
                      if self.js_fails:
                          raise RuntimeError("js failed")
                      return
                  self.real_calls += 1
                  if self.real_calls <= self.real_failures:
                      raise RuntimeError("no position or size")


          class Page:
              def __init__(self, button, visible_texts=None):
                  self.button = button
                  self.visible_texts = list(visible_texts or [""])

              def ele(self, *_args, **_kwargs):
                  return self.button

              def run_js(self, *_args, **_kwargs):
                  if len(self.visible_texts) > 1:
                      return self.visible_texts.pop(0)
                  return self.visible_texts[0]


          class CookieBannerClickTests(unittest.TestCase):
              @patch.object(browser_confirm, "_sleep", lambda _seconds: None)
              def test_retries_real_click_before_success(self):
                  button = Button(real_failures=1)
                  self.assertTrue(browser_confirm._click_cookie_button(Page(button), "Accept", lambda _m: None))
                  self.assertEqual(button.real_calls, 2)
                  self.assertEqual(button.js_calls, 0)

              @patch.object(browser_confirm, "_sleep", lambda _seconds: None)
              def test_js_fallback_is_cookie_specific(self):
                  button = Button(real_failures=3)
                  self.assertTrue(browser_confirm._click_cookie_button(Page(button), "Accept", lambda _m: None))
                  self.assertEqual(button.real_calls, 3)
                  self.assertEqual(button.js_calls, 1)

              @patch.object(browser_confirm, "_sleep", lambda _seconds: None)
              def test_dismiss_requires_banner_to_disappear(self):
                  button = Button()
                  page = Page(button, ["cookie", ""])
                  self.assertTrue(browser_confirm._dismiss_cookie_banner(page, lambda _m: None))

              @patch.object(browser_confirm, "_sleep", lambda _seconds: None)
              def test_banner_remaining_is_not_reported_as_dismissed(self):
                  button = Button()
                  page = Page(button, ["cookie"])
                  with patch.object(browser_confirm, "_wait_cookie_banner_gone", return_value=False):
                      self.assertFalse(browser_confirm._dismiss_cookie_banner(page, lambda _m: None))

              def test_general_real_click_has_no_js_fallback(self):
                  button = Button(real_failures=1)
                  result = browser_confirm._click_exact(Page(button), ["Allow"], lambda _m: None, real=True)
                  self.assertIsNone(result)
                  self.assertEqual(button.js_calls, 0)


          if __name__ == "__main__":
              unittest.main()
          ''').replace('\n          ', '\n'), encoding='utf-8')
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cpa_xai/browser_confirm.py tests/test_cookie_banner_click.py
          git commit -m "fix: retry cookie banner click safely"
          git push origin HEAD:fix/cookie-banner-click-retry

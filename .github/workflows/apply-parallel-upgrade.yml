name: apply-optional-multithread-upgrade

on:
  push:
    branches:
      - feat/optional-multithread-registration
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-multithread-registration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply guarded upgrade
        run: python tools/apply_parallel_upgrade.py
      - name: Fix generated isolation test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_optional_multithread.py')
          text = path.read_text(encoding='utf-8')
          old = 'module_path.write_text("value = None\\\\n", encoding="utf-8")'
          new = 'module_path.write_text("value = None\\n", encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit('isolation test fixture pattern mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile changed Python
        run: python -m compileall -q app_config.py account_outputs.py cpa_export.py registration_parallel.py grok_register_ttk.py tests/test_optional_multithread.py
      - name: Run full unit tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Check diff
        run: git diff --check
      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add optional isolated multithread registration"
          git push origin HEAD:feat/optional-multithread-registration

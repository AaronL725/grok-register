name: Proxy pool full credentials update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-test:
    if: github.event.pull_request.head.ref == 'fix/proxy-pool-show-full-credentials'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply full-credential display update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one target, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('proxy_pool.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import re\n', '', 1)
          old = '''def proxy_log_label(value):\n    raw = str(value or "").strip()\n    if not raw:\n        return "direct"\n    try:\n        parsed = urllib.parse.urlsplit(normalize_proxy_url(raw))\n        host = parsed.hostname or "?"\n        port = parsed.port\n        auth = "user:***@" if parsed.username is not None else ""\n        return "%s://%s%s%s" % (\n            parsed.scheme or "http", auth, host, (":%s" % port) if port else ""\n        )\n    except Exception:\n        return "(proxy)"\n\n\n_CREDENTIAL_URL_RE = re.compile(r"(?i)\\b(https?|socks4a?|socks5h?)://([^/\\s@]+)@")\n\n\ndef safe_proxy_error_text(value):\n    text = str(value or "")\n    return _CREDENTIAL_URL_RE.sub(lambda match: match.group(1) + "://***@", text)\n'''
          new = '''def proxy_log_label(value):\n    raw = str(value or "").strip()\n    if not raw:\n        return "direct"\n    try:\n        return normalize_proxy_url(raw)\n    except Exception:\n        return raw\n\n\ndef safe_proxy_error_text(value):\n    return str(value or "")\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('proxy_pool credential display target mismatch')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          replace_once(
              'tests/test_proxy_pool.py',
              '''    def test_snapshot_masks_proxy_credentials(self):\n        manager = ProxyPoolManager(self._config(proxy_mode="single", proxy="http://secret:password@127.0.0.1:8001"))\n        label = manager.snapshot()["nodes"][0]["proxy"]\n        self.assertIn("user:***@", label)\n        self.assertNotIn("secret", label)\n        self.assertNotIn("password", label)\n''',
              '''    def test_snapshot_exposes_proxy_credentials(self):\n        manager = ProxyPoolManager(self._config(proxy_mode="single", proxy="http://secret:password@127.0.0.1:8001"))\n        label = manager.snapshot()["nodes"][0]["proxy"]\n        self.assertEqual(label, "http://secret:password@127.0.0.1:8001")\n'''
          )
          replace_once(
              'tests/test_proxy_pool.py',
              '''    def test_proxy_error_text_masks_credentials(self):\n        value = safe_proxy_error_text("failed via socks5://secret:password@127.0.0.1:1080")\n        self.assertNotIn("secret", value)\n        self.assertNotIn("password", value)\n        self.assertIn("socks5://***@127.0.0.1:1080", value)\n''',
              '''    def test_proxy_error_text_preserves_credentials(self):\n        value = safe_proxy_error_text("failed via socks5://secret:password@127.0.0.1:1080")\n        self.assertIn("secret", value)\n        self.assertIn("password", value)\n        self.assertIn("socks5://secret:password@127.0.0.1:1080", value)\n'''
          )

          replace_once(
              'tests/test_web_control_plane.py',
              '''    def test_proxy_pool_status_masks_credentials(self):\n        cfg = self._base_config()\n        cfg.update({"proxy_mode": "single", "proxy": "http://secret:password@127.0.0.1:7890"})\n        with patch.object(self.server.engine, "load_config", side_effect=self._fake_load(cfg)):\n            response = self.client.get("/api/proxy-pool/status")\n        self.assertEqual(response.status_code, 200)\n        payload = response.json()\n        self.assertEqual(payload["mode"], "single")\n        self.assertEqual(len(payload["nodes"]), 1)\n        label = payload["nodes"][0]["proxy"]\n        self.assertIn("user:***@", label)\n        self.assertNotIn("secret", label)\n        self.assertNotIn("password", label)\n''',
              '''    def test_proxy_pool_status_exposes_credentials(self):\n        cfg = self._base_config()\n        cfg.update({"proxy_mode": "single", "proxy": "http://secret:password@127.0.0.1:7890"})\n        with patch.object(self.server.engine, "load_config", side_effect=self._fake_load(cfg)):\n            response = self.client.get("/api/proxy-pool/status")\n        self.assertEqual(response.status_code, 200)\n        payload = response.json()\n        self.assertEqual(payload["mode"], "single")\n        self.assertEqual(len(payload["nodes"]), 1)\n        label = payload["nodes"][0]["proxy"]\n        self.assertEqual(label, "http://secret:password@127.0.0.1:7890")\n'''
          )

          replace_once(
              'README.md',
              '- WebUI 提供独立“代理池”页查看脱敏节点、健康度、出口 IP、延迟、占用、失败数和冷却状态；GUI 提供精简配置和测试按钮。\n',
              '- WebUI 提供独立“代理池”页查看完整代理节点（包括认证信息）、健康度、出口 IP、延迟、占用、失败数和冷却状态；GUI 提供精简配置和测试按钮。\n'
          )

          replace_once(
              'docs/proxy-pool.md',
              '''节点状态只返回脱敏代理标识，例如：\n\n```text\nhttp://user:***@127.0.0.1:8080\n```\n\n不会返回代理用户名或密码。注册任务运行期间禁止手动 reload/test，避免人为改变活动调度状态。\n''',
              '''节点状态直接返回完整代理地址，包括用户名和密码，例如：\n\n```text\nhttp://user:password@127.0.0.1:8080\n```\n\n当前项目按个人部署场景设计，因此 WebUI、状态 API 与代理相关日志不会对代理凭据做脱敏。注册任务运行期间仍禁止手动 reload/test，避免人为改变活动调度状态。\n'''
          )
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add proxy_pool.py tests/test_proxy_pool.py tests/test_web_control_plane.py README.md docs/proxy-pool.md
            git commit -m "fix: show full proxy credentials in local UI"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-web.txt
      - name: Compile
        run: python -m compileall -q .
      - name: JavaScript syntax
        run: node --check web/proxy-pool.js
      - name: Diff check
        run: git diff --check
      - name: Tests
        run: python -m unittest discover -s tests -v

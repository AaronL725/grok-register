name: Apply WebUI PR50 polish

on:
  push:
    branches:
      - feat/web-ui-pr50-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-ui-pr50-polish
      - name: Apply focused visual patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}',
                  '*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}'
              ),
              (
                  '.topbar{height:62px;padding:0 28px;display:flex;align-items:center;gap:14px;background:var(--bar);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20}',
                  '.topbar{height:62px;padding:0 28px;display:flex;align-items:center;gap:14px;background:rgba(9,10,12,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20}'
              ),
              (
                  '.console-pill{padding:4px 9px;border-radius:999px;border:1px solid #4a5d00;background:#1b2400;color:var(--accent);font-size:11px;font-weight:700}',
                  '.repo-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid rgba(200,255,0,.28);background:rgba(200,255,0,.08);color:var(--accent);font-size:11px;font-weight:700;text-decoration:none;transition:.18s ease}.repo-pill svg{width:12px;height:12px;fill:currentColor}.repo-pill:hover{background:rgba(200,255,0,.14);border-color:rgba(200,255,0,.48);box-shadow:0 0 14px rgba(200,255,0,.10);transform:translateY(-1px)}'
              ),
              (
                  '.action.primary{background:var(--accent);color:#080b00;border-color:var(--accent)}',
                  '.action.primary{background:var(--accent);color:#080b00;border-color:var(--accent);box-shadow:0 0 0 1px rgba(200,255,0,.08),0 0 18px rgba(200,255,0,.08)}'
              ),
              (
                  '.action.primary:hover:not(:disabled){background:#d4ff36}',
                  '.action.primary:hover:not(:disabled){background:#d4ff36;box-shadow:0 0 20px rgba(200,255,0,.20);transform:translateY(-1px)}'
              ),
              (
                  '.stat{height:110px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:space-between}',
                  '.stat{height:110px;background:rgba(21,21,23,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}.stat:hover{border-color:#3a3a40;transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.16)}'
              ),
              (
                  '.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}',
                  '.panel{background:rgba(21,21,23,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.10)}'
              ),
              (
                  '.tab.active{color:var(--accent)}',
                  '.tab.active{color:var(--accent);background:rgba(200,255,0,.035)}'
              ),
              (
                  '@media(max-width:430px){.brand-name{font-size:16px}.console-pill{display:none}',
                  '@media(max-width:430px){.brand-name{font-size:16px}.repo-pill{padding:4px 7px}.repo-pill span{display:none}'
              ),
              (
                  '<div class="console-pill" data-i18n="console">控制台</div>',
                  '<a class="repo-pill" href="https://github.com/AaronL725/grok-register" target="_blank" rel="noopener noreferrer" aria-label="Open grok-register on GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.29-5.27-5.72 0-1.27.45-2.3 1.19-3.11-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.19a10.95 10.95 0 0 1 5.76 0c2.2-1.5 3.16-1.19 3.16-1.19.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.11 0 4.44-2.71 5.42-5.29 5.71.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg><span>@grok-register</span></a>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected pattern not found: ' + old[:100])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          assert 'href="https://github.com/AaronL725/grok-register"' in html
          assert '@grok-register' in html
          assert 'class="console-pill"' not in html
          assert 'class="repo-pill"' in html
          assert 'id="langZh"' in html and 'id="langEn"' in html
          assert html.count('id="tabs"') == 1
          assert html.count('id="sections"') == 1
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/index.html
          git diff --cached --check
          git commit -m "feat(web): polish dashboard and link repository badge"
          git push origin HEAD:feat/web-ui-pr50-polish

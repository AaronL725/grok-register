name: finalize-optional-multithread-upgrade

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-multithread-registration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply final guarded fixes
        run: python tools/finalize_parallel_upgrade.py
      - name: Compile changed Python
        run: python -m compileall -q grok_register_ttk.py registration_parallel.py tests/test_optional_multithread.py
      - name: Run full unit tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Check diff
        run: git diff --check
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden optional multithread controls and tests"
          git pull --rebase origin feat/optional-multithread-registration
          git push origin HEAD:feat/optional-multithread-registration

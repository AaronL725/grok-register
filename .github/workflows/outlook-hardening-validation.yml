name: Outlook hardening validation

on:
  push:
    branches: [feature/outlook-mailbox-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outlook-hardening-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -q

      - name: Check JavaScript syntax
        run: node --check web/outlook-mailbox.js

      - name: Audit final Outlook invariants
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path

          outlook = Path("outlook_mail.py").read_text(encoding="utf-8")
          pool = Path("outlook_mailbox_pool.py").read_text(encoding="utf-8")
          web = Path("web/server.py").read_text(encoding="utf-8")
          ui = Path("web/outlook-mailbox.js").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          assert "totalItemCount" not in outlook, "legacy Graph count cursor remains"
          assert "UIDVALIDITY" in outlook and 'client.uid("search"' in outlook, "IMAP UID cursor missing"
          assert '"junkemail"' in outlook and "OUTLOOK_GRAPH_JUNK_KEY" in outlook, "Graph JunkEmail monitoring missing"
          assert "Retry-After" in outlook and "MICROSOFT_HTTP_SEMAPHORE" in outlook, "Microsoft retry/concurrency hardening missing"
          assert "graph_seen_ids" in outlook, "cross-folder Graph replay guard missing"
          assert "del self._leases[key]" in pool and "lease.mailbox.close()" in pool, "one-shot lease cleanup missing"
          assert "/api/mailboxes/outlook/test" in web and "/api/mailboxes/outlook/test" in ui, "mailbox health check missing"
          assert "UIDVALIDITY + UID" in readme and "JunkEmail" in readme, "README not aligned with implementation"

          audited_paths = [
              Path("README.md"), Path("grok_register_ttk.py"), Path("outlook_mail.py"),
              Path("outlook_mailbox_pool.py"), Path("web/outlook-mailbox.js"), Path("web/server.py"),
              *Path("tests").glob("test_outlook*.py"),
          ]
          forbidden = ("msdsj", "grok-account-manager-main", "github.com/msdsj")
          for path in audited_paths:
              text = path.read_text(encoding="utf-8", errors="replace").lower()
              for marker in forbidden:
                  assert marker not in text, f"external provenance marker {marker!r} in {path}"

          # Outlook code must never log or format the OTP itself.
          lowered = outlook.lower()
          assert '验证码: {code}' not in outlook
          assert 'verification code: {code}' not in lowered
          print("Outlook cleanliness audit passed")
          PY

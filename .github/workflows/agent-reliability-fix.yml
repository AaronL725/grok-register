name: agent reliability repair

on:
  push:
    branches:
      - agent/fix-registration-reliability-plan

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-registration-reliability-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and correct scoped repair script
        shell: bash
        run: |
          git show b32150028297a12194bb427401268e874312db65:.github/workflows/agent-reliability-fix.yml > /tmp/original-repair.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('/tmp/original-repair.yml').read_text(encoding='utf-8')
          lines = src.splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          old = '''replace_once('registration_browser.py', '        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n', '        _mark_registration_stage(\"email_submit\")\\n        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n')'''
          new = textwrap.dedent('''
          value = text('registration_browser.py')
          begin = value.index('def fill_email_and_submit(')
          end_fn = value.index('def fill_code_and_submit(', begin)
          segment = value[begin:end_fn]
          needle = '        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n'
          if segment.count(needle) != 1:
              raise SystemExit(f'registration_browser.py: email submit matcher count={segment.count(needle)}')
          segment = segment.replace(needle, '        _mark_registration_stage(\"email_submit\")\\n' + needle, 1)
          write('registration_browser.py', value[:begin] + segment + value[end_fn:])
          ''').strip()
          if old not in script:
              raise SystemExit('unable to locate original email matcher in repair script')
          script = script.replace(old, new, 1)
          ui_start = script.index("# 6: Web UI surfaces uncertain results already returned by the backend.")
          ui_end = script.index("# Regression tests specific to this plan.", ui_start)
          ui = textwrap.dedent('''
          # 6: Web UI surfaces uncertain results already returned by the backend.
          replace_once('web/index.html', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span data-i18n="uncertain">结果不确定</span>: <b id="sUncertain">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>')
          value = text('web/index.html')
          replace = "$('sPending').textContent=s.pending||0;"
          if value.count(replace) != 1:
              raise SystemExit(f'web pollStatus pending matcher count={value.count(replace)}')
          value = value.replace(replace, replace + "$('sUncertain').textContent=s.uncertain||0;", 1)
          value = value.replace("pending:'待恢复',warnings:'警告'", "pending:'待恢复',uncertain:'结果不确定',warnings:'警告'", 1)
          value = value.replace("pending:'Pending',warnings:'Warnings'", "pending:'Pending',uncertain:'Uncertain',warnings:'Warnings'", 1)
          write('web/index.html', value)
          ''').strip() + '\n\n'
          script = script[:ui_start] + ui + script[ui_end:]
          script = script.replace("Path('tests/test_reliability_plan_regressions.py').write_text(r'''", "Path('tests/test_reliability_plan_regressions.py').write_text('''", 1)
          compat = textwrap.dedent('''
          # Preserve the RegistrationOperations extension API: real browser adapters mark exact commit boundaries,
          # while custom/test operations retain conservative coarse boundaries.
          replace_once('registration_flow.py', '    retry_exception: type\\n\\n\\n@dataclass\\nclass RegistrationResult:', '    retry_exception: type\\n    internal_stage_markers: bool = False\\n\\n\\n@dataclass\\nclass RegistrationResult:')
          replace_once('registration_flow.py', '        callbacks.log("[*] 2. 创建邮箱并提交")\\n        email, dev_token = ops.fill_email_and_submit()\\n', '        callbacks.log("[*] 2. 创建邮箱并提交")\\n        if not ops.internal_stage_markers:\\n            _set_registration_stage(STAGE_EMAIL_SUBMIT)\\n        email, dev_token = ops.fill_email_and_submit()\\n')
          replace_once('registration_flow.py', '        try:\\n            code = ops.fill_code_and_submit(email, dev_token)\\n', '        try:\\n            if not ops.internal_stage_markers:\\n                _set_registration_stage(STAGE_CODE_SUBMIT)\\n            code = ops.fill_code_and_submit(email, dev_token)\\n')
          replace_once('registration_flow.py', '    callbacks.log("[*] 4. 填写资料")\\n    profile = ops.fill_profile_and_submit()\\n', '    callbacks.log("[*] 4. 填写资料")\\n    if not ops.internal_stage_markers:\\n        _set_registration_stage(STAGE_PROFILE_SUBMIT)\\n    profile = ops.fill_profile_and_submit()\\n')
          replace_once('registration_flow.py', '                else:\\n                    result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 注册失败: {exc}")\\n', '                elif disposition == SAFE_NEW_LEASE:\\n                    raise\\n                else:\\n                    result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 注册失败: {exc}")\\n')
          replace_once('grok_register_ttk.py', '        retry_exception=AccountRetryNeeded,\\n    )\\n', '        retry_exception=AccountRetryNeeded,\\n        internal_stage_markers=True,\\n    )\\n')
          replace_once('registration_parallel.py', '            retry_exception=runtime_namespace["AccountRetryNeeded"],\\n        )\\n', '            retry_exception=runtime_namespace["AccountRetryNeeded"],\\n            internal_stage_markers=True,\\n        )\\n')
          ''').strip() + '\n'
          script += '\n' + compat
          Path('/tmp/repair.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/repair.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
      - name: Run complete test suite
        run: pytest -q
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_flow.py registration_browser.py registration_parallel.py browser_runtime.py mail_service.py cf_mail_debug.py proxy_pool_v3.py proxy_protocol_runtime.py app_config.py grok_register_ttk.py web/index.html tests/test_reliability_plan_regressions.py
          git commit -m "fix: complete registration reliability repair plan"
          git push origin HEAD:agent/fix-registration-reliability-plan

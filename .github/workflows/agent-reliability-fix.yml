name: agent reliability repair

on:
  push:
    branches:
      - agent/fix-registration-reliability-plan

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-registration-reliability-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped repair plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')
          def replace_once(path, old, new):
              value = text(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old[:80]!r}')
              write(path, value.replace(old, new, 1))
          def regex_once(path, pattern, repl, flags=0):
              value = text(path)
              new, count = re.subn(pattern, repl, value, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected one match, got {count}: {pattern[:100]!r}')
              write(path, new)

          # 1/2/3: one stage-aware batch engine for every proxy mode; stage is marked at actual submit boundary.
          replace_once('registration_flow.py',
              '        callbacks.log("[*] 2. 创建邮箱并提交")\n        _set_registration_stage(STAGE_EMAIL_SUBMIT)\n        email, dev_token = ops.fill_email_and_submit()\n',
              '        callbacks.log("[*] 2. 创建邮箱并提交")\n        email, dev_token = ops.fill_email_and_submit()\n')
          replace_once('registration_flow.py',
              '        try:\n            _set_registration_stage(STAGE_CODE_SUBMIT)\n            code = ops.fill_code_and_submit(email, dev_token)\n',
              '        try:\n            code = ops.fill_code_and_submit(email, dev_token)\n')
          replace_once('registration_flow.py',
              '    callbacks.log("[*] 4. 填写资料")\n    _set_registration_stage(STAGE_PROFILE_SUBMIT)\n    profile = ops.fill_profile_and_submit()\n',
              '    callbacks.log("[*] 4. 填写资料")\n    profile = ops.fill_profile_and_submit()\n')
          old = '''                if proxy_failure and disposition == SAFE_NEW_LEASE:\n                    retry_count_for_slot += 1\n                    if retry_count_for_slot <= settings.max_slot_retry:\n                        callbacks.log(f"[!] 当前账号代理在安全阶段不可用，释放租约并重试 {retry_count_for_slot}/{settings.max_slot_retry}: {exc}")\n                    else:\n                        result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 当前账号代理重试达到上限，跳过: {exc}")\n                elif proxy_failure and disposition in (OUTCOME_UNCERTAIN, NO_RETRY):\n                    _record_uncertain(result, callbacks, stage, exc); retry_count_for_slot = 0\n                else:\n                    result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 注册失败: {exc}")\n'''
          new = '''                if disposition == OUTCOME_UNCERTAIN:\n                    _record_uncertain(result, callbacks, stage, exc); retry_count_for_slot = 0\n                elif proxy_failure and disposition == SAFE_NEW_LEASE:\n                    retry_count_for_slot += 1\n                    if retry_count_for_slot <= settings.max_slot_retry:\n                        callbacks.log(f"[!] 当前账号代理在安全阶段不可用，释放租约并重试 {retry_count_for_slot}/{settings.max_slot_retry}: {exc}")\n                    else:\n                        result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 当前账号代理重试达到上限，跳过: {exc}")\n                else:\n                    result.fail_count += 1; result.processed_count += 1; retry_count_for_slot = 0; callbacks.log(f"[-] 注册失败: {exc}")\n'''
          replace_once('registration_flow.py', old, new)
          regex_once('registration_flow.py', r'''    mode = str\(app_config\.get\("proxy_mode", "auto"\) or "auto"\)\.strip\(\)\.lower\(\)\n    if mode in \("single", "pool"\):\n        return _run_batch_managed\(settings, callbacks, observer, ops\)\n    return _run_batch_legacy\(settings, callbacks, observer, ops\)''',
              '    # All modes share the same stage-aware retry engine. begin_registration_slot() is a no-op when the proxy manager is unmanaged.\n    return _run_batch_managed(settings, callbacks, observer, ops)')

          # registration_browser commit-boundary marker and bounded SSO exception recovery.
          insert = '''\n\ndef _mark_registration_stage(stage):\n    # Function-local import avoids an import-time cycle while keeping the browser module reusable.\n    from registration_flow import _set_registration_stage\n    return _set_registration_stage(stage)\n'''
          replace_once('registration_browser.py', 'SIGNUP_URL = "https://accounts.x.ai/sign-up?redirect=grok-com"\n', 'SIGNUP_URL = "https://accounts.x.ai/sign-up?redirect=grok-com"\n' + insert)
          replace_once('registration_browser.py', '        clicked = page.run_js(\n            r"""\nfunction isVisible(node) {\n', '        _mark_registration_stage("email_submit")\n        clicked = page.run_js(\n            r"""\nfunction isVisible(node) {\n')
          # The second matching click block is in code submission; anchor on the preceding failed check.
          replace_once('registration_browser.py', '            sleep_with_cancel(0.5, cancel_callback)\n            continue\n\n        clicked = page.run_js(\n            r"""\nfunction isVisible(node) {\n    if (!node) return false;\n    const style = window.getComputedStyle(node);\n', '            sleep_with_cancel(0.5, cancel_callback)\n            continue\n\n        _mark_registration_stage("code_submit")\n        clicked = page.run_js(\n            r"""\nfunction isVisible(node) {\n    if (!node) return false;\n    const style = window.getComputedStyle(node);\n')
          replace_once('registration_browser.py', '        submit_state = page.run_js(\n            r"""\nfunction isVisible(node) {\n', '        _mark_registration_stage("profile_submit")\n        submit_state = page.run_js(\n            r"""\nfunction isVisible(node) {\n')
          replace_once('registration_browser.py', '    last_wait_exception_message = ""\n    last_wait_exception_at = 0.0\n', '    last_wait_exception_message = ""\n    last_wait_exception_at = 0.0\n    consecutive_wait_errors = 0\n    last_wait_exception = None\n')
          replace_once('registration_browser.py', '        except PageDisconnectedError:\n            refresh_active_page()\n        except AccountRetryNeeded:\n            raise\n        except Exception as exc:\n            if log_callback:\n                now = time.time()\n                message = f"{exc.__class__.__name__}: {exc}"\n                if message != last_wait_exception_message or now - last_wait_exception_at >= 10:\n                    log_callback(f"[Debug] 等待 sso cookie 时出现异常，将继续等待: {message}")\n                    last_wait_exception_message = message\n                    last_wait_exception_at = now\n', '        except PageDisconnectedError:\n            consecutive_wait_errors = 0\n            refresh_active_page()\n        except AccountRetryNeeded:\n            raise\n        except ProxyTransportError:\n            raise\n        except Exception as exc:\n            consecutive_wait_errors += 1\n            last_wait_exception = exc\n            if log_callback:\n                now = time.time()\n                message = f"{exc.__class__.__name__}: {exc}"\n                if message != last_wait_exception_message or now - last_wait_exception_at >= 10:\n                    log_callback(f"[Debug] 等待 sso cookie 时出现异常 ({consecutive_wait_errors}/3): {message}")\n                    last_wait_exception_message = message\n                    last_wait_exception_at = now\n            if consecutive_wait_errors >= 3:\n                raise RuntimeError(f"等待 sso cookie 连续异常: {last_wait_exception.__class__.__name__}: {last_wait_exception}") from last_wait_exception\n')
          replace_once('registration_browser.py', '    raise Exception(\n        f"等待超时：未获取到 sso cookie。已看到 cookies: {sorted(last_seen_names)}"\n    )\n', '    cause = "" if last_wait_exception is None else f"; last_error={last_wait_exception.__class__.__name__}: {last_wait_exception}"\n    raise Exception(\n        f"等待超时：未获取到 sso cookie。已看到 cookies: {sorted(last_seen_names)}{cause}"\n    )\n')

          # 5/8: aggregate uncertain counts and share provider domain rotation across workers.
          replace_once('registration_parallel.py', '        "postprocess_warning_count": int(batch.postprocess_warning_count),\n        "cancelled": bool(batch.cancelled),\n', '        "postprocess_warning_count": int(batch.postprocess_warning_count),\n        "uncertain_count": int(batch.uncertain_count),\n        "cancelled": bool(batch.cancelled),\n')
          replace_once('registration_parallel.py', '        total.postprocess_warning_count += snapshot["postprocess_warning_count"]\n        total.cancelled = total.cancelled or snapshot["cancelled"]\n', '        total.postprocess_warning_count += snapshot["postprocess_warning_count"]\n        total.uncertain_count += snapshot["uncertain_count"]\n        total.cancelled = total.cancelled or snapshot["cancelled"]\n')
          replace_once('registration_parallel.py', '_ROOT = Path(__file__).resolve().parent\n', '''_ROOT = Path(__file__).resolve().parent\n\n\nclass DomainAllocator:\n    def __init__(self):\n        self._lock = threading.Lock()\n        self._indexes = {}\n\n    def next(self, provider, domains):\n        values = list(domains or [])\n        if not values:\n            return ""\n        with self._lock:\n            index = int(self._indexes.get(provider, 0))\n            self._indexes[provider] = index + 1\n        return values[index % len(values)]\n''')
          replace_once('registration_parallel.py', '    fatal_errors = []\n', '    fatal_errors = []\n    domain_allocator = DomainAllocator()\n')
          replace_once('registration_parallel.py', '        worker_namespace = dict(runtime_namespace)\n', '        worker_namespace = dict(runtime_namespace)\n        worker_namespace["domain_allocator"] = domain_allocator\n')

          # 9: POSTs are non-replayable by default; read-only POST callers opt in explicitly.
          replace_once('browser_runtime.py', 'def http_post(url, **kwargs):\n    request_kwargs = _build_request_kwargs(**kwargs)\n', 'def http_post(url, **kwargs):\n    replay_safe = bool(kwargs.pop("replay_safe", False))\n    request_kwargs = _build_request_kwargs(**kwargs)\n')
          replace_once('browser_runtime.py', '        if is_proxy_connection_error(exc):\n            if managed_proxy_active():\n                raise ProxyTransportError(safe_proxy_error_text(exc)) from exc\n            direct = dict(request_kwargs)\n            direct.pop("proxies", None)\n            return requests.post(url, **direct)\n        raise\n', '        if is_proxy_connection_error(exc):\n            if managed_proxy_active() or not replay_safe:\n                raise ProxyTransportError(safe_proxy_error_text(exc)) from exc\n            direct = dict(request_kwargs)\n            direct.pop("proxies", None)\n            return requests.post(url, **direct)\n        raise\n')

          # 7/8: consistent Cloudflare query-key and shared domain allocator.
          replace_once('mail_service.py', '        elif mode != "none":\n            headers["Authorization"] = f"Bearer {key}"\n', '        elif mode not in ("none", "query-key"):\n            headers["Authorization"] = f"Bearer {key}"\n')
          replace_once('mail_service.py', '    if is_admin_create:\n        payload = {"name": generate_username(10), "enablePrefix": True}\n        if domain:\n            payload["domain"] = domain\n        headers = cloudflare_build_headers(content_type=True)\n    else:\n        payload = {}\n        if domain:\n            payload["domain"] = domain\n        headers = {"Content-Type": "application/json"}\n    resp = http_post(url, json=payload, headers=headers)\n', '    if is_admin_create:\n        payload = {"name": generate_username(10), "enablePrefix": True}\n        if domain:\n            payload["domain"] = domain\n    else:\n        payload = {}\n        if domain:\n            payload["domain"] = domain\n    headers = cloudflare_build_headers(content_type=True)\n    resp = http_post(url, json=payload, headers=headers, params=cloudflare_apply_auth_params())\n')
          replace_once('mail_service.py', '    domain = domains[_cf_domain_index % len(domains)]\n    _cf_domain_index += 1\n    return domain\n', '    allocator = globals().get("domain_allocator")\n    if allocator is not None:\n        return allocator.next("cloudflare", domains)\n    domain = domains[_cf_domain_index % len(domains)]\n    _cf_domain_index += 1\n    return domain\n')
          replace_once('mail_service.py', '    domain = domains[_cloudmail_domain_index % len(domains)]\n    _cloudmail_domain_index += 1\n    return domain\n', '    allocator = globals().get("domain_allocator")\n    if allocator is not None:\n        return allocator.next("cloudmail", domains)\n    domain = domains[_cloudmail_domain_index % len(domains)]\n    _cloudmail_domain_index += 1\n    return domain\n')
          replace_once('mail_service.py', '        json=payload,\n        timeout=20,\n    )\n', '        json=payload,\n        timeout=20,\n        replay_safe=True,\n    )\n')
          replace_once('mail_service.py', '    def build_auth_headers(self, content_type=False):\n', '    def build_auth_params(self, params=None):\n        merged = dict(params or {})\n        if self.api_key and self.auth_mode == "query-key":\n            merged["key"] = self.api_key\n        return merged\n\n    def build_auth_headers(self, content_type=False):\n')
          replace_once('mail_service.py', '        elif self.auth_mode == "bearer":\n            headers["Authorization"] = "Bearer " + self.api_key\n', '        elif self.auth_mode == "bearer":\n            headers["Authorization"] = "Bearer " + self.api_key\n')
          replace_once('mail_service.py', '        response = requests.post(self.api_base + self.create_path, json=payload, headers=headers, timeout=self.timeout)\n', '        headers = self.build_auth_headers(content_type=True)\n        response = requests.post(self.api_base + self.create_path, json=payload, headers=headers, params=self.build_auth_params(), timeout=self.timeout)\n')
          replace_once('cf_mail_debug.py', 'choices=["none", "bearer", "x-api-key", "x-admin-auth"]', 'choices=["none", "query-key", "bearer", "x-api-key", "x-admin-auth"]')

          # 10: preflight distinguishes transport reachability from registration usability.
          replace_once('proxy_pool_v3.py', '                    results.append({"url": url, "reachable": 100 <= status_code < 600, "status_code": status_code, "latency_ms": max(1, int((time.monotonic()-started)*1000)), "cloudflare_block": bool(cloudflare and status_code in (403, 429, 503)), "error": ""})\n', '                    reachable = 100 <= status_code < 600\n                    cloudflare_block = bool(cloudflare and status_code in (403, 429, 503))\n                    usable = bool(reachable and not cloudflare_block and 200 <= status_code < 400)\n                    results.append({"url": url, "reachable": reachable, "usable": usable, "status_code": status_code, "latency_ms": max(1, int((time.monotonic()-started)*1000)), "cloudflare_block": cloudflare_block, "error": ""})\n')
          replace_once('proxy_pool_v3.py', '                    results.append({"url": url, "reachable": False, "status_code": 0, "latency_ms": max(1, int((time.monotonic()-started)*1000)), "cloudflare_block": False, "error": safe_proxy_error_text(exc)[:300]})\n            return {"id": node_id, "ok": all(item["reachable"] for item in results), "targets": results}\n', '                    results.append({"url": url, "reachable": False, "usable": False, "status_code": 0, "latency_ms": max(1, int((time.monotonic()-started)*1000)), "cloudflare_block": False, "error": safe_proxy_error_text(exc)[:300]})\n            return {"id": node_id, "ok": all(item["usable"] for item in results), "targets": results}\n')

          # 11: bounded sing-box startup retry closes the free-port TOCTOU window operationally.
          pattern = r'''    def _start_entry\(self, descriptor\):\n        executable = self\._find_executable\(\)\n        port = self\._free_port\(\)\n        path = self\._write_config\(self\._build_config\(descriptor, port\)\)\n        process = None\n        try:\n(?P<body>.*?)            raise ProxyRuntimeError\("等待 sing-box 本地代理启动超时"\)\n        except Exception:\n(?P<cleanup>.*?)            raise\n'''
          value = text('proxy_protocol_runtime.py')
          m = re.search(pattern, value, re.S)
          if not m:
              raise SystemExit('proxy_protocol_runtime.py: _start_entry shape changed')
          replacement = '''    def _start_entry(self, descriptor):\n        executable = self._find_executable()\n        errors = []\n        for attempt in range(1, 5):\n            port = self._free_port()\n            path = self._write_config(self._build_config(descriptor, port))\n            process = None\n            try:\n                self._check_config(executable, path)\n                process = subprocess.Popen([executable, "run", "-c", path], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\n                deadline = time.time() + self.start_timeout\n                while time.time() < deadline:\n                    code = process.poll()\n                    if code is not None:\n                        raise ProxyRuntimeError("sing-box 在本地代理就绪前退出，code=%s" % code)\n                    if self._port_ready(port):\n                        self.log("[*] 高级代理运行时已就绪: %s -> 127.0.0.1:%s" % (descriptor.protocol, port))\n                        now = time.time()\n                        return RuntimeEntry(descriptor.node_id, process, port, path, 0, last_used=now)\n                    time.sleep(0.05)\n                raise ProxyRuntimeError("等待 sing-box 本地代理启动超时")\n            except Exception as exc:\n                errors.append("attempt=%s port=%s: %s" % (attempt, port, exc))\n                if process is not None:\n                    try:\n                        process.terminate(); process.wait(timeout=2)\n                    except Exception:\n                        try:\n                            process.kill()\n                        except Exception:\n                            pass\n                try:\n                    os.unlink(path)\n                except Exception:\n                    pass\n        raise ProxyRuntimeError("sing-box startup failed after 4 attempts: %s" % "; ".join(errors))\n'''
          write('proxy_protocol_runtime.py', value[:m.start()] + replacement + value[m.end():])

          # 12: strict config schema.
          replace_once('app_config.py', '    if not isinstance(raw, dict):\n        raise ConfigError("config root must be a JSON object")\n    cfg = {**DEFAULT_CONFIG, **raw}\n', '    if not isinstance(raw, dict):\n        raise ConfigError("config root must be a JSON object")\n    unknown = sorted(set(raw) - set(DEFAULT_CONFIG))\n    if unknown:\n        raise ConfigError("未知配置项: " + ", ".join(unknown))\n    cfg = {**DEFAULT_CONFIG, **raw}\n')

          # 6: Web UI surfaces uncertain results already returned by the backend.
          replace_once('web/index.html', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span data-i18n="uncertain">结果不确定</span>: <b id="sUncertain">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>')
          # Add translation keys next to pending wherever both locale dictionaries define it.
          value = text('web/index.html')
          value, n1 = re.subn(r'(pending\s*:\s*["\'][^"\']+["\'],)', r'\1 uncertain:"结果不确定",', value, count=1)
          value, n2 = re.subn(r'(pending\s*:\s*["\'][^"\']+["\'],)', r'\1 uncertain:"Uncertain",', value, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'web translations not patched: {n1}/{n2}')
          if 's.uncertain' not in value:
              value, count = re.subn(r'(document\.getElementById\(["\']sPending["\']\)\.textContent\s*=\s*s\.pending\s*\|\|\s*0\s*;)', r'\1\n  document.getElementById("sUncertain").textContent = s.uncertain || 0;', value, count=1)
              if count != 1:
                  raise SystemExit('web pollStatus uncertain insertion failed')
          write('web/index.html', value)

          # Regression tests specific to this plan.
          Path('tests/test_reliability_plan_regressions.py').write_text(r'''import pathlib\n\nimport pytest\n\nimport app_config\nimport browser_runtime\nimport mail_service\nimport registration_parallel\nfrom registration_flow import BatchResult\n\n\ndef test_parallel_aggregate_preserves_uncertain_count():\n    one = BatchResult(uncertain_count=2, fail_count=2, processed_count=2)\n    two = BatchResult(uncertain_count=1, fail_count=1, processed_count=1)\n    total = registration_parallel._aggregate({1: registration_parallel._summary_copy(one), 2: registration_parallel._summary_copy(two)})\n    assert total.uncertain_count == 3\n\n\ndef test_domain_allocator_is_process_shared_and_provider_scoped():\n    allocator = registration_parallel.DomainAllocator()\n    assert [allocator.next("cf", ["a", "b", "c"]) for _ in range(4)] == ["a", "b", "c", "a"]\n    assert allocator.next("cloudmail", ["x", "y"]) == "x"\n\n\ndef test_query_key_has_params_but_no_bearer(monkeypatch):\n    mail_service.config = {"cloudflare_api_key": "secret", "cloudflare_auth_mode": "query-key"}\n    assert mail_service.cloudflare_apply_auth_params() == {"key": "secret"}\n    assert "Authorization" not in mail_service.cloudflare_build_headers()\n    client = mail_service.CloudflareMailClient("https://example.test", auth_mode="query-key", api_key="secret")\n    assert client.build_auth_params() == {"key": "secret"}\n    assert "Authorization" not in client.build_auth_headers()\n\n\ndef test_unknown_config_key_rejected():\n    with pytest.raises(app_config.ConfigError):\n        app_config.validate_config_structure({"multi_thread_worker": 8})\n\n\ndef test_http_post_is_not_replayed_by_default(monkeypatch):\n    browser_runtime._config = {"proxy_mode": "auto", "proxy": "http://proxy.invalid:1"}\n    calls = []\n    def fail(url, **kwargs):\n        calls.append(kwargs)\n        raise RuntimeError("proxy connection refused")\n    monkeypatch.setattr(browser_runtime.requests, "post", fail)\n    monkeypatch.setattr(browser_runtime, "is_proxy_connection_error", lambda exc: True)\n    with pytest.raises(Exception):\n        browser_runtime.http_post("https://example.test", json={"x": 1})\n    assert len(calls) == 1\n\n\ndef test_preflight_source_contains_usable_semantics():\n    source = pathlib.Path("proxy_pool_v3.py").read_text(encoding="utf-8")\n    assert '"usable": usable' in source\n    assert 'all(item["usable"] for item in results)' in source\n\n\ndef test_web_ui_renders_uncertain():\n    source = pathlib.Path("web/index.html").read_text(encoding="utf-8")\n    assert 'id="sUncertain"' in source\n    assert 's.uncertain' in source\n\n\ndef test_all_modes_use_stage_aware_batch_engine():\n    source = pathlib.Path("registration_flow.py").read_text(encoding="utf-8")\n    tail = source[source.index("def run_batch("):]\n    assert "return _run_batch_managed" in tail\n    assert "return _run_batch_legacy" not in tail\n''', encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
      - name: Run complete test suite
        run: pytest -q
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_flow.py registration_browser.py registration_parallel.py browser_runtime.py mail_service.py cf_mail_debug.py proxy_pool_v3.py proxy_protocol_runtime.py app_config.py web/index.html tests/test_reliability_plan_regressions.py
          git commit -m "fix: complete registration reliability repair plan"
          git push origin HEAD:agent/fix-registration-reliability-plan

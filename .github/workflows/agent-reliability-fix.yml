name: agent reliability repair

on:
  push:
    branches:
      - agent/fix-registration-reliability-plan

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-registration-reliability-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and correct scoped repair script
        shell: bash
        run: |
          git show b32150028297a12194bb427401268e874312db65:.github/workflows/agent-reliability-fix.yml > /tmp/original-repair.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('/tmp/original-repair.yml').read_text(encoding='utf-8')
          lines = src.splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          old = '''replace_once('registration_browser.py', '        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n', '        _mark_registration_stage(\"email_submit\")\\n        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n')'''
          new = textwrap.dedent('''
          value = text('registration_browser.py')
          begin = value.index('def fill_email_and_submit(')
          end_fn = value.index('def fill_code_and_submit(', begin)
          segment = value[begin:end_fn]
          needle = '        clicked = page.run_js(\\n            r\"\"\"\\nfunction isVisible(node) {\\n'
          if segment.count(needle) != 1:
              raise SystemExit(f'registration_browser.py: email submit matcher count={segment.count(needle)}')
          segment = segment.replace(needle, '        _mark_registration_stage(\"email_submit\")\\n' + needle, 1)
          write('registration_browser.py', value[:begin] + segment + value[end_fn:])
          ''').strip()
          if old not in script:
              raise SystemExit('unable to locate original email matcher in repair script')
          script = script.replace(old, new, 1)
          ui_start = script.index("# 6: Web UI surfaces uncertain results already returned by the backend.")
          ui_end = script.index("# Regression tests specific to this plan.", ui_start)
          ui = textwrap.dedent('''
          # 6: Web UI surfaces uncertain results already returned by the backend.
          replace_once('web/index.html', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>', '<span data-i18n="pending">待恢复</span>: <b id="sPending">0</b></span><span><span>结果不确定</span>: <b id="sUncertain">0</b></span><span><span data-i18n="warnings">警告</span>: <b id="sWarnings">0</b>')
          value = text('web/index.html')
          if 's.uncertain' not in value:
              value, count = re.subn(r'(document\\.getElementById\\(["\\\']sPending["\\\']\\)\\.textContent\\s*=\\s*s\\.pending\\s*\\|\\|\\s*0\\s*;)', r'\\1\\n  document.getElementById("sUncertain").textContent = s.uncertain || 0;', value, count=1)
              if count != 1:
                  raise SystemExit('web pollStatus uncertain insertion failed')
          write('web/index.html', value)
          ''').strip() + '\n\n'
          script = script[:ui_start] + ui + script[ui_end:]
          Path('/tmp/repair.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/repair.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
      - name: Run complete test suite
        run: pytest -q
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_flow.py registration_browser.py registration_parallel.py browser_runtime.py mail_service.py cf_mail_debug.py proxy_pool_v3.py proxy_protocol_runtime.py app_config.py web/index.html tests/test_reliability_plan_regressions.py
          git commit -m "fix: complete registration reliability repair plan"
          git push origin HEAD:agent/fix-registration-reliability-plan

name: agent final reliability audit v2
on:
  push:
    branches: [agent/fix-registration-reliability-plan]
permissions:
  contents: write
jobs:
  audit-fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-registration-reliability-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact final integration patch
        env:
          PATCH_SCRIPT_B64: 
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['PATCH_SCRIPT_B64']))"
      - name: Install dependencies
        run: python -m pip install -r requirements-web.txt pytest
      - name: Run full suite
        run: pytest -q
      - name: Commit validated integration fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_parallel.py registration_browser.py
          git commit -m "fix: close reliability audit integration gaps"
          git push origin HEAD:agent/fix-registration-reliability-plan

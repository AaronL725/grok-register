name: Final Outlook validation pass

on:
  push:
    branches: [feature/outlook-mailbox-pool]
    paths:
      - .github/workflows/outlook-final-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-final-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/outlook-mailbox-pool
          fetch-depth: 0

      - name: Apply final Outlook cleanup and validation hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app_config.py')
          text = path.read_text(encoding='utf-8')

          obsolete = '''\n\ndef _reset_outlook_runtime():\n    try:\n        from outlook_mailbox_pool import reset_shared_outlook_runtime\n        reset_shared_outlook_runtime()\n    except Exception:\n        pass\n'''
          if text.count(obsolete) != 1:
              raise SystemExit('obsolete reset hook did not match exactly once')
          text = text.replace(obsolete, '', 1)
          text, removed_calls = re.subn(
              r'(?m)^[ \t]*_reset_outlook_runtime\(\)\n', '', text
          )
          if removed_calls != 3:
              raise SystemExit(f'expected 3 obsolete reset calls, found {removed_calls}')

          old_validation = '''    if provider == "outlook":\n        path = os.path.realpath(os.path.abspath(os.path.expanduser(cfg["outlook_accounts_file"])))\n        if not os.path.isfile(path):\n            raise ConfigError(f"Outlook 模式需要有效的账号池文件: {path}")\n        try:\n            from outlook_mailbox_pool import load_outlook_mailbox_pool\n            summary = load_outlook_mailbox_pool(path)\n        except Exception as exc:\n            raise ConfigError(f"Outlook 账号池读取失败: {exc}") from exc\n        if summary.get("invalid"):\n            raise ConfigError(f"Outlook 账号池存在 {summary['invalid']} 条无效记录")\n        if summary.get("duplicates"):\n            raise ConfigError("Outlook 账号池存在重复邮箱: " + ", ".join(summary["duplicates"][:3]))\n        if int(summary.get("count") or 0) <= 0:\n            raise ConfigError("Outlook 账号池没有有效账号")\n'''
          new_validation = '''    if provider == "outlook":\n        path = os.path.realpath(os.path.abspath(os.path.expanduser(cfg["outlook_accounts_file"])))\n        if not os.path.isfile(path):\n            raise ConfigError(f"Outlook 模式需要有效的账号池文件: {path}")\n        try:\n            from outlook_mailbox_pool import get_outlook_mailbox_pool_capacity\n            count = get_outlook_mailbox_pool_capacity(path)\n        except Exception as exc:\n            raise ConfigError(f"Outlook 账号池校验失败: {exc}") from exc\n        if int(count) <= 0:\n            raise ConfigError("Outlook 账号池没有有效账号")\n'''
          if text.count(old_validation) != 1:
              raise SystemExit('Outlook validation block did not match exactly once')
          text = text.replace(old_validation, new_validation, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_outlook_config_validation.py')
          test_path.write_text(r'''import tempfile
import unittest
from pathlib import Path

import app_config
from outlook_mailbox_pool import save_outlook_mailbox_pool


class OutlookConfigValidationTests(unittest.TestCase):
    def _config(self, path):
        cfg = dict(app_config.DEFAULT_CONFIG)
        cfg["email_provider"] = "outlook"
        cfg["outlook_accounts_file"] = str(path)
        return cfg

    def test_valid_pool_passes_full_run_validation(self):
        with tempfile.TemporaryDirectory() as tmp:
            path = Path(tmp) / "outlook.txt"
            save_outlook_mailbox_pool(
                path,
                "u@example.com----pw----client----refresh-token----auto\n",
            )
            validated = app_config.validate_run_requirements(self._config(path))
            self.assertEqual(validated["email_provider"], "outlook")

    def test_oversized_pool_is_reported_as_config_error(self):
        with tempfile.TemporaryDirectory() as tmp:
            path = Path(tmp) / "outlook.txt"
            path.write_text(
                "u@example.com----pw----client----" + ("x" * 1_000_001) + "----auto\n",
                encoding="utf-8",
            )
            with self.assertRaises(app_config.ConfigError):
                app_config.validate_run_requirements(self._config(path))

    def test_duplicate_pool_is_reported_as_config_error(self):
        with tempfile.TemporaryDirectory() as tmp:
            path = Path(tmp) / "outlook.txt"
            path.write_text(
                "u@example.com----pw----client----token1----auto\n"
                "U@example.com----pw----client2----token2----graph\n",
                encoding="utf-8",
            )
            with self.assertRaises(app_config.ConfigError):
                app_config.validate_run_requirements(self._config(path))


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.9
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/outlook-final-cleanup.yml

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Outlook mailbox pool validation"
          git push origin HEAD:feature/outlook-mailbox-pool

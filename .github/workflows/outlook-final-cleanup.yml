name: Final Outlook runtime cleanup

on:
  push:
    branches: [feature/outlook-mailbox-pool]
    paths:
      - .github/workflows/outlook-final-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-final-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/outlook-mailbox-pool
          fetch-depth: 0

      - name: Remove obsolete process-global runtime reset hook
        shell: python
        run: |
          from pathlib import Path
          path = Path('app_config.py')
          text = path.read_text(encoding='utf-8')
          block = '''\n\ndef _reset_outlook_runtime():\n    try:\n        from outlook_mailbox_pool import reset_shared_outlook_runtime\n        reset_shared_outlook_runtime()\n    except Exception:\n        pass\n'''
          if text.count(block) != 1:
              raise SystemExit('obsolete reset hook did not match exactly once')
          text = text.replace(block, '', 1)
          count = text.count('    _reset_outlook_runtime()\n')
          if count != 3:
              raise SystemExit(f'expected 3 obsolete reset calls, found {count}')
          text = text.replace('    _reset_outlook_runtime()\n', '')
          path.write_text(text, encoding='utf-8')

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.9
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Test Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/outlook-final-cleanup.yml

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean obsolete Outlook runtime hook"
          git push origin HEAD:feature/outlook-mailbox-pool

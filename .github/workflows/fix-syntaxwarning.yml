name: fix-syntaxwarning

on:
  push:
    branches:
      - agent/fix-syntaxwarning

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-syntaxwarning
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Apply exact SyntaxWarning fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('registration_browser.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        filled = page.run_js(\n            """\nconst email = arguments[0];'
          start = text.find(anchor)
          if start < 0:
              raise SystemExit('target email JS block not found')
          end_marker = '            """,\n            email,\n        )'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('target email JS block end not found')
          end += len(end_marker)
          block = text[start:end]
          needle = "replace(/\\s+/g, ' ')"
          if block.count(needle) != 2:
              raise SystemExit(f'expected exactly 2 unsafe regex escapes in target block, got {block.count(needle)}')
          fixed = block.replace(needle, "replace(/\\\\s+/g, ' ')")
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify warning is gone and behavior-preserving source shape
        run: |
          python -Wd -m py_compile registration_browser.py 2>pycompile.stderr
          cat pycompile.stderr
          if grep -F "invalid escape sequence" pycompile.stderr; then
            echo "SyntaxWarning still present"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('registration_browser.py').read_text(encoding='utf-8')
          anchor = '        filled = page.run_js(\n            """\nconst email = arguments[0];'
          start = text.index(anchor)
          end = text.index('            """,\n            email,\n        )', start)
          block = text[start:end]
          assert block.count("replace(/\\\\s+/g, ' ')") == 2
          assert "replace(/\\s+/g, ' ')" not in block
          PY

      - name: Run full test suite
        run: pytest -q

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-syntaxwarning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_browser.py .github/workflows/fix-syntaxwarning.yml
          git diff --cached --check
          git commit -m "fix: eliminate embedded JS SyntaxWarning"
          git push origin HEAD:agent/fix-syntaxwarning

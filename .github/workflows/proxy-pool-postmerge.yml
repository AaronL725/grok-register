name: Proxy pool post-merge hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: github.event.pull_request.head.ref == 'fix/proxy-pool-postmerge-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('proxy_pool.py')
          text = p.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('import os\n', 'import os\nimport re\n', 1)
          if 'class ProxyAcquireCancelled' not in text:
              text = text.replace(
                  'class ProxyAcquireTimeout(ProxyPoolError):\n    pass\n\n\nclass ProxyTransportError',
                  'class ProxyAcquireTimeout(ProxyPoolError):\n    pass\n\n\nclass ProxyAcquireCancelled(ProxyPoolError):\n    pass\n\n\nclass ProxyTransportError',
                  1,
              )
          if 'def safe_proxy_error_text' not in text:
              marker = 'def _node_id(proxy_url):\n'
              helper = '''_CREDENTIAL_URL_RE = re.compile(r"(?i)\\b(https?|socks4a?|socks5h?)://([^/\\s@]+)@")\n\n\ndef safe_proxy_error_text(value):\n    text = str(value or "")\n    return _CREDENTIAL_URL_RE.sub(lambda match: match.group(1) + "://***@", text)\n\n\n'''
              if marker not in text:
                  raise SystemExit('proxy redaction marker missing')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '                self.log("[!] 代理池刷新失败，继续使用当前节点: %s" % exc)\n',
              '                self.log("[!] 代理池刷新失败，继续使用当前节点: %s" % safe_proxy_error_text(exc))\n',
          )
          text = text.replace('                errors.append(str(exc))\n', '                errors.append(safe_proxy_error_text(exc))\n')
          text = text.replace(
              '                node.last_error = "soft: %s" % str(error or "")[:160]\n',
              '                node.last_error = "soft: %s" % safe_proxy_error_text(error)[:160]\n',
          )
          text = text.replace('            error = str(exc)\n', '            error = safe_proxy_error_text(exc)\n')
          text = text.replace(
              '        return {"mode": str((config or {}).get("proxy_mode") or "auto"), "managed": False, "nodes": [], "error": str(exc)}\n',
              '        return {"mode": str((config or {}).get("proxy_mode") or "auto"), "managed": False, "nodes": [], "error": safe_proxy_error_text(exc)}\n',
          )

          old_fetch = '''        via = str(self.config.get("proxy_pool_subscription_proxy") or "").strip()\n        proxies = {"http": via, "https": via} if via else {}\n        response = requests.get(\n            url,\n            proxies=proxies,\n            timeout=min(max(self.probe_timeout, 5), 60),\n            allow_redirects=True,\n            headers={"Accept": "text/plain, text/*;q=0.9, */*;q=0.1"},\n        )\n        if not 200 <= int(response.status_code) < 300:\n            raise ProxyPoolError("代理订阅返回 HTTP %s" % response.status_code)\n'''
          new_fetch = '''        via = str(self.config.get("proxy_pool_subscription_proxy") or "").strip()\n        if via:\n            via = normalize_proxy_url(via)\n        proxies = {"http": via, "https": via} if via else {}\n        current_url = url\n        response = None\n        for redirect_count in range(4):\n            try:\n                response = requests.get(\n                    current_url,\n                    proxies=proxies,\n                    timeout=min(max(self.probe_timeout, 5), 60),\n                    allow_redirects=False,\n                    headers={"Accept": "text/plain, text/*;q=0.9, */*;q=0.1"},\n                )\n            except Exception as exc:\n                raise ProxyPoolError("代理订阅请求失败: %s" % safe_proxy_error_text(exc)) from exc\n            status_code = int(response.status_code)\n            if status_code not in (301, 302, 303, 307, 308):\n                break\n            if redirect_count >= 3:\n                raise ProxyPoolError("代理订阅重定向次数超过 3 次")\n            location = str((getattr(response, "headers", {}) or {}).get("location") or "").strip()\n            if not location:\n                raise ProxyPoolError("代理订阅重定向缺少 Location")\n            current_url = urllib.parse.urljoin(current_url, location)\n            redirected = urllib.parse.urlsplit(current_url)\n            if redirected.scheme not in ("http", "https") or not redirected.netloc:\n                raise ProxyPoolError("代理订阅重定向地址无效")\n        if response is None or not 200 <= int(response.status_code) < 300:\n            status_code = int(getattr(response, "status_code", 0) or 0)\n            raise ProxyPoolError("代理订阅返回 HTTP %s" % status_code)\n'''
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)
          elif '代理订阅重定向次数超过 3 次' not in text:
              raise SystemExit('subscription fetch target mismatch')

          text = text.replace(
              '    def acquire(self, affinity, worker_key, slot_index, attempt_index, session_key, timeout=None):\n',
              '    def acquire(self, affinity, worker_key, slot_index, attempt_index, session_key, timeout=None, cancel_callback=None):\n',
              1,
          )
          cancel_check = '                if cancel_callback and cancel_callback():\n                    raise ProxyAcquireCancelled("代理租约等待已取消")\n'
          if cancel_check not in text:
              marker = '            while True:\n                now = time.time()\n'
              if marker not in text:
                  raise SystemExit('acquire cancel marker missing')
              text = text.replace('            while True:\n                now = time.time()\n', '            while True:\n' + cancel_check + '                now = time.time()\n', 1)
          text = text.replace(
              'def begin_registration_slot(slot_index, attempt_index=1, worker_key=None, log=None):\n',
              'def begin_registration_slot(slot_index, attempt_index=1, worker_key=None, log=None, cancel_callback=None):\n',
              1,
          )
          new_call = '''        attempt_index=attempt,\n        session_key=session_key,\n        cancel_callback=cancel_callback,\n    )\n'''
          if new_call not in text:
              old_call = '''        attempt_index=attempt,\n        session_key=session_key,\n    )\n'''
              if text.count(old_call) != 1:
                  raise SystemExit('begin slot acquire marker mismatch')
              text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('browser_runtime.py')
          text = p.read_text(encoding='utf-8')
          if '    safe_proxy_error_text,\n' not in text:
              text = text.replace('    managed_proxy_active,\n)', '    managed_proxy_active,\n    safe_proxy_error_text,\n)', 1)
          text = text.replace('                raise ProxyTransportError(str(exc)) from exc\n', '                raise ProxyTransportError(safe_proxy_error_text(exc)) from exc\n')
          p.write_text(text, encoding='utf-8')

          p = Path('registration_browser.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from proxy_pool import ProxyTransportError\n', 'from proxy_pool import ProxyTransportError, safe_proxy_error_text\n', 1)
          text = text.replace('raise ProxyTransportError("Chromium 通过当前代理启动失败: %s" % last_exc) from last_exc', 'raise ProxyTransportError("Chromium 通过当前代理启动失败: %s" % safe_proxy_error_text(last_exc)) from last_exc')
          text = text.replace('raise ProxyTransportError("当前代理访问注册页失败: %s" % e) from e', 'raise ProxyTransportError("当前代理访问注册页失败: %s" % safe_proxy_error_text(e)) from e')
          p.write_text(text, encoding='utf-8')

          p = Path('registration_flow.py')
          text = p.read_text(encoding='utf-8')
          if '    ProxyAcquireCancelled,\n' not in text:
              text = text.replace('    ProxyPoolError,\n', '    ProxyAcquireCancelled,\n    ProxyPoolError,\n', 1)
          if '                    cancel_callback=callbacks.cancelled,\n' not in text:
              text = text.replace('                    worker_key=threading.current_thread().name,\n                    log=callbacks.log,\n', '                    worker_key=threading.current_thread().name,\n                    log=callbacks.log,\n                    cancel_callback=callbacks.cancelled,\n', 1)
          cancel_block = '''            except ProxyAcquireCancelled:\n                result.cancelled = True\n                callbacks.log("[!] 已在等待代理租约时停止")\n                continue_batch = False\n'''
          if cancel_block not in text:
              marker = '            except ops.cancelled_exception:\n'
              index = text.find(marker, text.find('def _run_batch_managed'))
              if index < 0:
                  raise SystemExit('managed cancel marker missing')
              text = text[:index] + cancel_block + text[index:]
          p.write_text(text, encoding='utf-8')

          p = Path('web/proxy-pool.js')
          text = p.read_text(encoding='utf-8')
          if '    if (dirty.size && !await saveConfig()) return;\n' not in text:
              marker = "  async function proxyAction(path) {\n"
              if marker not in text:
                  raise SystemExit('proxy action marker missing')
              text = text.replace(marker, marker + '    if (dirty.size && !await saveConfig()) return;\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_proxy_pool.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from proxy_pool import ProxyPoolManager, parse_proxy_source\n', 'from proxy_pool import (\n    ProxyAcquireCancelled, ProxyPoolManager, parse_proxy_source, safe_proxy_error_text,\n)\n', 1)
          extra = '''\n    def test_acquire_honors_cancellation(self):\n        manager = ProxyPoolManager(self._config(proxy_mode="single", proxy="http://127.0.0.1:8001"))\n        with self.assertRaises(ProxyAcquireCancelled):\n            manager.acquire("a", "worker", 1, 1, "session", timeout=30, cancel_callback=lambda: True)\n\n    def test_release_is_idempotent(self):\n        manager = ProxyPoolManager(self._config(proxy_mode="single", proxy="http://127.0.0.1:8001"))\n        lease = manager.acquire("a", "worker", 1, 1, "session", timeout=1)\n        manager.release(lease)\n        manager.release(lease)\n        self.assertEqual(manager.snapshot()["nodes"][0]["inflight"], 0)\n\n    def test_proxy_error_text_masks_credentials(self):\n        value = safe_proxy_error_text("failed via socks5://secret:password@127.0.0.1:1080")\n        self.assertNotIn("secret", value)\n        self.assertNotIn("password", value)\n        self.assertIn("socks5://***@127.0.0.1:1080", value)\n'''
          if 'def test_acquire_honors_cancellation' not in text:
              marker = '\n\nif __name__ == "__main__":\n'
              if marker not in text:
                  raise SystemExit('proxy test footer missing')
              text = text.replace(marker, extra + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add proxy_pool.py browser_runtime.py registration_browser.py registration_flow.py web/proxy-pool.js tests/test_proxy_pool.py
            git commit -m "fix: harden proxy lease cancellation and redaction"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-web.txt
      - name: Compile
        run: python -m compileall -q .
      - name: JavaScript syntax
        run: node --check web/proxy-pool.js
      - name: Diff check
        run: git diff --check
      - name: Tests
        run: python -m unittest discover -s tests -v

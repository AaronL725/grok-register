const fieldDefs={basic:[['register_count','number',{min:1,max:2500}],['multi_thread_workers','number',{min:1,max:8}],['multi_thread_enabled','checkbox'],['enable_nsfw','checkbox'],['proxy','text','full'],['user_agent','text','full']],mail:[['email_provider','select',['duckmail','yyds','cloudflare','cloudmail']],['duckmail_api_key','password'],['yyds_api_key','password'],['yyds_jwt','password'],['cloudflare_api_base','text','full'],['cloudflare_api_key','password'],['cloudflare_auth_mode','select',['none','bearer','x-api-key','x-admin-auth','query-key']],['cloudflare_path_domains','text'],['cloudflare_path_accounts','text'],['cloudflare_path_token','text'],['cloudflare_path_messages','text'],['defaultDomains','text','full'],['cloudmail_api_base','text','full'],['cloudmail_public_token','password'],['cloudmail_domains','text'],['cloudmail_path_messages','text','full']],pool:[['grok2api_auto_add_local','checkbox'],['grok2api_local_token_file','text'],['grok2api_pool_name','select',['ssoBasic','ssoSuper']],['grok2api_auto_add_remote','checkbox'],['grok2api_remote_base','text','full'],['grok2api_remote_app_key','password'],['grok2api_remote_admin_username','text'],['grok2api_remote_admin_password','password'],['grok2api_allow_legacy_full_save','checkbox']],cpa:[['cpa_export_enabled','checkbox'],['cpa_auth_dir','text'],['cpa_copy_to_hotload','checkbox'],['cpa_hotload_dir','text'],['cpa_base_url','text','full'],['cpa_proxy','text','full'],['cpa_headless','checkbox'],['cpa_force_standalone','checkbox'],['cpa_mint_timeout_sec','number',{min:30,max:1800}],['cpa_mint_cookie_inject','checkbox'],['cpa_oidc_request_timeout_sec','number',{min:3,max:120}],['cpa_oidc_poll_timeout_sec','number',{min:3,max:120}],['api_reverse_tools','text','full']]};
const tabMeta={basic:['tabBasic','basic'],mail:['tabMail','mail'],pool:['tabPool','pool'],cpa:['tabCpa','cpa']};
let lang=localStorage.getItem('grok_register_lang')==='en'?'en':'zh',dirty=new Set(),lastSeq=0,running=false,serverLatest=0,lastStatus={cancelled:false};
function t(key){return i18n[lang][key]||i18n.zh[key]||key}
function renderFields(){const tabs=$('tabs'),sections=$('sections');tabs.innerHTML='';sections.innerHTML='';let first=true;for(const [section,defs] of Object.entries(fieldDefs)){const [tabKey,iconKey]=tabMeta[section];const tab=document.createElement('button');tab.type='button';tab.className='tab'+(first?' active':'');tab.dataset.target='sec-'+section;tab.dataset.tabkey=tabKey;tab.innerHTML=icons[iconKey]+'<span>'+t(tabKey)+'</span>';tabs.appendChild(tab);const box=document.createElement('div');box.className='section'+(first?' active':'');box.id='sec-'+section;const grid=document.createElement('div');grid.className='grid';box.appendChild(grid);sections.appendChild(box);for(const [key,type,extra] of defs){const label=(i18n[lang].fields[key]||[key,''])[0],help=(i18n[lang].fields[key]||[key,''])[1];if(type==='checkbox'){const row=document.createElement('label');row.className='check-row';const input=document.createElement('input');input.type='checkbox';input.id=key;const text=document.createElement('span');text.textContent=label;row.append(input,text);grid.appendChild(row);if(help){const h=document.createElement('div');h.className='check-help';h.textContent=help;grid.appendChild(h)}input.addEventListener('change',()=>dirty.add(key));continue}const wrap=document.createElement('div');wrap.className='field'+(extra==='full'?' full':'');const lab=document.createElement('label');lab.className='field-label';lab.htmlFor=key;lab.textContent=label;let input;if(type==='select'){input=document.createElement('select');for(const value of extra){const o=document.createElement('option');o.value=value;o.textContent=value;input.appendChild(o)}}else{input=document.createElement('input');input.type=type;const opt=extra&&typeof extra==='object'?extra:{};if(opt.min!==undefined)input.min=opt.min;if(opt.max!==undefined)input.max=opt.max}input.id=key;const helper=document.createElement('div');helper.className='field-help';helper.textContent=help;wrap.append(lab,input,helper);grid.appendChild(wrap);input.addEventListener('input',()=>dirty.add(key));input.addEventListener('change',()=>dirty.add(key))}first=false}tabs.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(!tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$(tab.dataset.target).classList.add('active')})}
function applyLanguage(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});$('langZh').classList.toggle('active',lang==='zh');$('langEn').classList.toggle('active',lang==='en');for(const [key,[tabKey]] of Object.entries(tabMeta)){const tab=document.querySelector('[data-tabkey="'+tabKey+'"] span');if(tab)tab.textContent=t(tabKey)}for(const defs of Object.values(fieldDefs)){for(const [key,type] of defs){const el=$(key);if(!el)continue;const [label,help]=i18n[lang].fields[key]||[key,''];if(type==='checkbox'){const span=el.parentElement.querySelector('span');if(span)span.textContent=label;const h=el.parentElement.nextElementSibling;if(h&&h.classList.contains('check-help'))h.textContent=help}else{const wrap=el.parentElement;const lab=wrap.querySelector('.field-label'),h=wrap.querySelector('.field-help');if(lab)lab.textContent=label;if(h)h.textContent=help}}}updateStatusText(lastStatus)}
function setLanguage(next){lang=next;localStorage.setItem('grok_register_lang',lang);applyLanguage()}
function setNotice(text,bad=false){const n=$('notice');n.textContent=text||'';n.className='notice'+(bad?' error':'')}
function setFormDisabled(disabled){document.querySelectorAll('#sections input,#sections select').forEach(el=>el.disabled=disabled);$('saveBtn').disabled=disabled;$('startBtn').disabled=disabled;$('stopBtn').hidden=!disabled}
function applyConfig(cfg){for(const defs of Object.values(fieldDefs)){for(const [key,type] of defs){const el=$(key);if(!el||!(key in cfg))continue;if(type==='checkbox')el.checked=!!cfg[key];else el.value=cfg[key]??''}}dirty.clear()}
function readValue(key){const el=$(key);if(!el)return undefined;if(el.type==='checkbox')return el.checked;if(el.type==='number')return Number.parseInt(el.value,10);return el.value}
async function loadConfig(){const r=await fetch('/api/config');if(!r.ok)throw new Error((await r.json()).detail||t('loadFailed'));const d=await r.json();applyConfig(d.config||{})}
async function saveConfig(){if(running)return false;const payload={};for(const key of dirty)payload[key]=readValue(key);if(!Object.keys(payload).length){setNotice(t('noChanges'));return true}const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){setNotice(d.detail||t('saveFailed'),true);return false}applyConfig(d.config||{});setNotice(t('saved'));$('saveState').textContent=t('saved');setTimeout(()=>{$('saveState').textContent=''},1800);return true}
async function startJob(){if(dirty.size&&!await saveConfig())return;setNotice('');const r=await fetch('/api/start',{method:'POST'});const d=await r.json();if(!r.ok){setNotice(d.detail||t('startFailed'),true);return}await pollStatus()}
async function stopJob(){const r=await fetch('/api/stop',{method:'POST'});const d=await r.json();if(!r.ok)setNotice(d.detail||t('stopFailed'),true);else setNotice(d.stopped?t('stopSent'):t('noJob'))}
function appendLine(entry){const body=$('terminal'),empty=$('emptyLog');if(empty)empty.remove();const nearBottom=body.scrollHeight-body.scrollTop-body.clientHeight<80;const div=document.createElement('div');div.className='line';const line=String(entry.line||'');if(line.includes('[+]'))div.classList.add('ok');else if(line.includes('[!]'))div.classList.add('bad');else if(line.includes('[*]'))div.classList.add('info');else if(line.toLowerCase().includes('warn'))div.classList.add('warn');div.textContent=line;body.appendChild(div);while(body.children.length>2000)body.removeChild(body.firstChild);if(nearBottom)body.scrollTop=body.scrollHeight}
async function pollLogs(){try{const r=await fetch('/api/logs?after='+lastSeq);if(!r.ok)return;const d=await r.json();serverLatest=d.latest||lastSeq;for(const e of d.entries||[]){appendLine(e);lastSeq=Math.max(lastSeq,Number(e.seq)||0)}}catch(_){}}
function updateStatusText(s={}){lastStatus=s;const dot=$('statusDot');dot.className='status-dot'+(running?' running':(s.cancelled?' cancelled':''));$('sStatus').textContent=running?t('running'):(s.cancelled?t('stopped'):t('idle'));$('startBtn').hidden=running;$('stopBtn').hidden=!running}
async function pollStatus(){try{const r=await fetch('/api/status');if(!r.ok)return;const s=await r.json();running=!!s.running;$('sTarget').textContent=s.target||0;$('sSuccess').textContent=s.success||0;$('sFail').textContent=s.fail||0;$('sPending').textContent=s.pending||0;$('sWarnings').textContent=s.warnings||0;updateStatusText(s);setFormDisabled(running);if(s.error)setNotice(s.error,true)}catch(_){}}
async function copyLogs(){const text=[...$('terminal').querySelectorAll('.line')].map(x=>x.textContent).join('\n');try{await navigator.clipboard.writeText(text);setNotice(t('copied'))}catch(_){setNotice(t('copyFailed'),true)}}
function clearLogs(){const body=$('terminal');body.innerHTML='<div id="emptyLog" class="empty-log">'+t('logReady')+'</div>';lastSeq=serverLatest}
function bind(){renderFields();applyLanguage();$('langZh').onclick=()=>setLanguage('zh');$('langEn').onclick=()=>setLanguage('en');$('saveBtn').onclick=()=>saveConfig().catch(e=>setNotice(e.message,true));$('startBtn').onclick=()=>startJob().catch(e=>setNotice(e.message,true));$('stopBtn').onclick=()=>stopJob().catch(e=>setNotice(e.message,true));$('copyBtn').onclick=()=>copyLogs();$('clearBtn').onclick=()=>clearLogs();loadConfig().catch(e=>setNotice(e.message,true));pollStatus();pollLogs();setInterval(pollStatus,1000);setInterval(pollLogs,1000)}
bind();
</script>
